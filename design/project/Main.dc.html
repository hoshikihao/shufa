<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&amp;display=swap">
<style>
body{margin:0;background:#f3eee2}
a{color:#23211d}a:hover{color:#a8352b}
@keyframes inkBloom{0%{transform:scale(.12);opacity:0}30%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes inkDrift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,-3%) scale(1.07)}100%{transform:translate(-3%,2%) scale(.95)}}
@keyframes inkMorph{0%{border-radius:42% 58% 63% 37%/41% 44% 56% 59%}50%{border-radius:58% 42% 38% 62%/55% 61% 39% 45%}100%{border-radius:47% 53% 55% 45%/62% 38% 62% 38%}}
@keyframes scrollSway{0%{transform:rotate(-.45deg)}100%{transform:rotate(.45deg)}}
@keyframes mountainPan{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes mistBreath{0%,100%{opacity:.55}50%{opacity:.9}}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes curlUp{0%{opacity:0}8%{opacity:1}90%{opacity:1}100%{opacity:0}}
@keyframes curlDown{0%{opacity:0}8%{opacity:1}90%{opacity:1}100%{opacity:0}}
@keyframes fallIn{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>

<div onClick="{{onPageClick}}" style="position: relative; font-family: 'Noto Serif SC', 'Songti SC', serif; background: #f3eee2; color: #23211d; overflow: hidden">

  <section style="position: relative; min-height: 860px; box-sizing: border-box; padding: 0 6vw">

    <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">

        <div style="width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(closest-side, rgba(35,33,29,.30), rgba(35,33,29,.12) 55%, rgba(35,33,29,0)); filter: blur(22px); animation: inkMorph 18s ease-in-out infinite alternate, inkDrift 28s ease-in-out infinite alternate; animation-play-state: {{play}}"></div>
      </div>

      </div>

            <path d="M0 170 C140 120 220 60 340 90 C430 112 480 40 600 34 C720 28 780 120 880 128 C980 136 1040 70 1150 62 C1260 54 1330 140 1400 162 L1440 170 L1440 240 L0 240 Z" fill="#23211d" opacity=".06"></path>
            <path transform="translate(1440 0)" d="M0 170 C140 120 220 60 340 90 C430 112 480 40 600 34 C720 28 780 120 880 128 C980 136 1040 70 1150 62 C1260 54 1330 140 1400 162 L1440 170 L1440 240 L0 240 Z" fill="#23211d" opacity=".06"></path>

        </div>

          <svg viewBox="0 0 2880 190" preserveAspectRatio="none" style="width: 100%; height: 100%; display: block">
            <path d="M0 150 C100 128 180 80 280 96 C380 112 420 150 520 140 C640 128 700 70 820 78 C940 86 990 146 1100 150 C1210 154 1290 112 1380 132 L1440 150 L1440 190 L0 190 Z" fill="#23211d" opacity=".11"></path>
            <path transform="translate(1440 0)" d="M0 150 C100 128 180 80 280 96 C380 112 420 150 520 140 C640 128 700 70 820 78 C940 86 990 146 1100 150 C1210 154 1290 112 1380 132 L1440 150 L1440 190 L0 190 Z" fill="#23211d" opacity=".11"></path>

        <div style="position: absolute; left: 0; right: 0; bottom: 70px; height: 90px; background: linear-gradient(rgba(243,238,226,0), rgba(243,238,226,.8) 50%, rgba(243,238,226,0)); animation: mistBreath 12s ease-in-out infinite; animation-play-state: {{play}}"></div>

            <img ref="{{lotusRef}}" src="/_blob/ab75c63f186ed873d4bccc4c2214e52f" alt="吴冠中 1990 年所作荷花图" style="width: 100%; aspect-ratio: 1002 / 1024; display: block; box-shadow: 0 0 0 1px rgba(80,66,48,.25)">
          </div>

            </span>
            <span style="position: relative; display: block; width: calc(100% + 24px); margin-left: -12px; height: {{rodH}}; transition: height 2.8s cubic-bezier(.4,.1,.6,.9); transition-delay: {{rollDelay}}; border-radius: 8px; background: linear-gradient(90deg, #241b14 0, #3a2d22 22px, rgba(0,0,0,0) 22px, rgba(0,0,0,0) calc(100% - 22px), #3a2d22 calc(100% - 22px), #241b14 100%), linear-gradient(#e6dcc6, #cbc1aa 38%, #a59a82 78%, #8a7f6a); box-shadow: 0 6px 12px rgba(35,33,29,.18)">
              <span style="position: absolute; left: 26px; right: 26px; bottom: 100%; height: 44px; background: linear-gradient(rgba(35,33,29,0), rgba(35,33,29,.08) 45%, rgba(35,33,29,.30) 88%, rgba(250,244,230,.45)); opacity: 0; animation: {{curlAnim}} 2.8s cubic-bezier(.4,.1,.6,.9) both; animation-delay: {{rollDelay}}"></span>
            </span>

        </div>
        <figcaption style="display: grid; text-align: center">
          <span aria-hidden="{{capOpenHidden}}" style="grid-area: 1 / 1; display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: {{capOpenOpacity}}; transition: opacity .5s ease {{capOpenDelay}}">

  <section id="shelf" style="position: relative; max-width: 960px; margin: 0 auto; padding: 24px 6vw 96px; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px">

    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">

  <footer id="about" style="max-width: 960px; margin: 0 auto; padding: 48px 6vw 64px; box-sizing: border-box; border-top: 1px solid rgba(35,33,29,.18); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 13px; letter-spacing: .15em; color: #625c52">
    <span>星树书房 · 个人非商业项目</span>

  <canvas ref="{{canvasRef}}" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4"></canvas>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#a8352b","options":["#a8352b","#8c2f28","#b4552d","#23211d"]},"motion":{"editor":"boolean","default":true},"scrollRolled":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1600}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.pond = { shrimp: [], last: 0, wasRolled: null };
    this.loop = (now) => { this.tickPond(now); this.raf = requestAnimationFrame(this.loop); };
    this.raf = requestAnimationFrame(this.loop);
  }
  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
  }

  // 墨虾：挂轴卷起后从荷花图里游出，在首页随处游动；点击时尾扇连弹向后逃开；挂轴放下时游回画里消失
  makeShrimp() {
    // 大小、墨色、背向、身形各不相同：越大越浓，像近处的虾
    const near = Math.random();
    return { x: 0, y: 0, vx: 0, vy: 0, ang: 0, prevAng: 0, turnRate: 0, L: 55 + 95 * Math.pow(near, 1.2),
      tone: 0.5 + 0.5 * near, side: Math.random() < 0.5 ? 1 : -1,
      pose: { arch: Math.random(), claw: Math.random() - 0.5, ant: Math.random() },
      jit: Array.from({ length: 64 }, () => Math.random()), sprites: [],
      mode: 'hidden', t: 0, alpha: 0, scale: 0.35, curl: 0, kick: 0, phase: Math.random() * 10,
      wanderAng: 0, thrustIn: 0, flips: 0, flipIn: 0, power: 0, aim: 0, delay: 0, tx: 0, ty: 0 };
  }

  tickPond(now) {
    const canvas = this.canvasEl, root = canvas && canvas.parentElement, img = this.lotusEl, p = this.pond;
    if (!canvas || !root || !p) return;
    const dt = p.last ? Math.min(0.05, (now - p.last) / 1000) : 0;
    p.last = now;
    const rr = root.getBoundingClientRect(), W = rr.width, H = rr.height, dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
    }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!this.motionOn || reduce || !img) return;
    const ir = img.getBoundingClientRect();
    const box = { x: ir.left - rr.left, y: ir.top - rr.top, w: ir.width, h: ir.height };
    if (!p.shrimp.length) p.shrimp = Array.from({ length: 8 }, () => this.makeShrimp());
    if (this.rolledNow !== p.wasRolled) {
      if (this.rolledNow) {
        // 等挂轴卷完再出画；页面初始就是卷起状态时立即出画
        const wait = p.wasRolled === null ? 0.3 : 2.5;
        p.shrimp.forEach((s, i) => {
          if (s.mode === 'return' || s.mode === 'vanish') { s.mode = 'wander'; s.alpha = 1; s.scale = 1; s.wanderAng = s.ang; return; }
          if (s.mode === 'hidden') { s.mode = 'waiting'; s.delay = wait + i * 0.2 + Math.random() * 0.4; }
        });
      } else if (p.wasRolled) {
        p.shrimp.forEach((s) => {
          if (s.mode === 'waiting' || s.mode === 'hidden') { s.mode = 'hidden'; return; }
          s.mode = 'return';
          s.tx = box.x + box.w * (0.2 + 0.6 * Math.random());
          s.ty = box.y + box.h * (0.3 + 0.5 * Math.random());
        });
      }
      p.wasRolled = this.rolledNow;
    }
    for (const s of p.shrimp) this.stepShrimp(s, dt, box, W, H);
    for (const s of p.shrimp) if (s.alpha > 0.01) this.drawShrimp(ctx, s, now / 1000);
  }

  stepShrimp(s, dt, box, W, H) {
    const TAU = Math.PI * 2;
    const turnTo = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    s.t += dt;
    if (s.mode === 'hidden') { s.alpha = 0; return; }
    if (s.mode === 'waiting') {
      s.delay -= dt;
      if (s.delay > 0) return;
      s.mode = 'emerge';
      s.t = 0;
      s.x = box.x + box.w * (0.15 + 0.7 * Math.random());
      s.y = box.y + box.h * (0.15 + 0.7 * Math.random());
      s.ang = s.prevAng = Math.atan2(s.y - (box.y + box.h / 2), s.x - (box.x + box.w / 2)) + (Math.random() - 0.5) * 0.8;
      s.vx = Math.cos(s.ang) * 40;
      s.vy = Math.sin(s.ang) * 40;
    }
    let drag = 1.4;
    if (s.mode === 'emerge') {
      // 由淡变浓、由小变大，像从画面里浮出来，同时朝画外游
      const k = Math.min(1, s.t / 1.2);
      s.alpha = k;
      s.scale = 0.35 + 0.65 * k;
      s.vx += Math.cos(s.ang) * 150 * dt;
      s.vy += Math.sin(s.ang) * 150 * dt;
      drag = 0.9;
      if (k >= 1) { s.mode = 'wander'; s.wanderAng = s.ang; s.thrustIn = 0.4; }
    } else if (s.mode === 'wander') {
      // 平时一下一下划水前进，偶尔停住；靠近页面边缘就掉头
      s.wanderAng += (Math.random() - 0.5) * 3 * dt;
      let want = s.wanderAng;
      const m = 90;
      if (s.x < m || s.x > W - m || s.y < m || s.y > H - m) {
        want = Math.atan2(H / 2 - s.y, W / 2 - s.x);
        s.wanderAng += turnTo(s.wanderAng, want) * 2 * dt;
      }
      s.ang += clamp(turnTo(s.ang, want), -1.6 * dt, 1.6 * dt);
      s.thrustIn -= dt;
      if (s.thrustIn <= 0) {
        if (Math.random() < 0.25) {
          s.thrustIn = 1.5 + Math.random() * 2.5;
        } else {
          const push = (45 + Math.random() * 60) * s.L / 90;
          s.vx += Math.cos(s.ang) * push;
          s.vy += Math.sin(s.ang) * push;
          s.kick = 1;
          s.thrustIn = 0.5 + Math.random() * 1.2;
        }
      }
    } else if (s.mode === 'flee') {
      // 头先转向惊扰处，尾扇猛收，整只虾向后弹出，连弹几下，一下比一下弱
      drag = 3.2;
      if (s.aim > 0) { s.aim -= dt; s.ang += clamp(turnTo(s.ang, s.threatAng), -20 * dt, 20 * dt); }
      s.flipIn -= dt;
      if (s.flips > 0 && s.flipIn <= 0) {
        s.vx -= Math.cos(s.ang) * s.power;
        s.vy -= Math.sin(s.ang) * s.power;
        s.curl = 1;
        s.power *= 0.6;
        s.flips -= 1;
        s.flipIn = 0.17 + Math.random() * 0.06;
      }
      if (s.flips === 0 && s.flipIn < -0.7) { s.mode = 'wander'; s.wanderAng = s.ang; s.thrustIn = 0.8 + Math.random(); }
    } else if (s.mode === 'return') {
      // 主动游回画里：头朝目标，越远游得越快
      const dist = Math.hypot(s.tx - s.x, s.ty - s.y);
      s.ang += clamp(turnTo(s.ang, Math.atan2(s.ty - s.y, s.tx - s.x)), -8 * dt, 8 * dt);
      const sp = clamp(dist / 0.7, 420, 1500);
      s.vx += (Math.cos(s.ang) * sp - s.vx) * Math.min(1, 6 * dt);
      s.vy += (Math.sin(s.ang) * sp - s.vy) * Math.min(1, 6 * dt);
      s.kick = 1;
      drag = 0;
      if (dist < 40) { s.mode = 'vanish'; s.t = 0; }
    } else if (s.mode === 'vanish') {
      const k = Math.min(1, s.t / 0.45);
      s.alpha = 1 - k;
      s.scale = 1 - 0.6 * k;
      drag = 4;
      if (k >= 1) s.mode = 'hidden';
    }
    const f = Math.exp(-drag * dt);
    s.vx *= f;
    s.vy *= f;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    if (s.mode === 'flee' || s.mode === 'wander') {
      if (s.x < 10 || s.x > W - 10) { s.x = clamp(s.x, 10, W - 10); s.vx *= -0.3; }
      if (s.y < 10 || s.y > H - 10) { s.y = clamp(s.y, 10, H - 10); s.vy *= -0.3; }
    }
    s.curl = Math.max(0, s.curl - dt * 5);
    s.kick = Math.max(0, s.kick - dt * 2);
    if (dt > 0) s.turnRate += (turnTo(s.prevAng, s.ang) / dt - s.turnRate) * Math.min(1, 8 * dt);
    s.prevAng = s.ang;
  }

  startle(clientX, clientY) {
    const p = this.pond, root = this.canvasEl && this.canvasEl.parentElement;
    if (!p || !root) return;
    const rr = root.getBoundingClientRect(), cx = clientX - rr.left, cy = clientY - rr.top;
    for (const s of p.shrimp) {
      if (s.mode !== 'wander' && s.mode !== 'flee' && s.mode !== 'emerge') continue;
      const d = Math.hypot(s.x - cx, s.y - cy);
      if (d > 260) continue;
      s.mode = 'flee';
      s.alpha = 1;
      s.scale = 1;
      s.threatAng = Math.atan2(cy - s.y, cx - s.x);
      s.aim = 0.08;
      s.flips = d < 140 ? 3 : 2;
      s.power = 300 + 650 * (1 - d / 260);
      s.flipIn = 0.06 + Math.random() * 0.05;
    }
  }

  // 虾身（头胸、腹节、尾扇）预先画成离屏图：淡墨打底、背侧压浓墨、节间留白缝、再擦出飞白；按蜷身程度分 4 档缓存
  renderBody(s, curl) {
    const L = s.L, R = 2, W = L * 1.7, H = L * 1.5, ox = L * 1.15, oy = L * 0.7;
    const c = document.createElement('canvas');
    c.width = Math.ceil(W * R);
    c.height = Math.ceil(H * R);
    const g = c.getContext('2d');
    g.scale(R, R);
    g.translate(ox, oy);
    const ink = (a) => 'rgba(28,26,23,' + Math.min(1, a) + ')';
    const polar = (p, a, r) => [p[0] + Math.cos(a) * r, p[1] + Math.sin(a) * r];
    let k = 0;
    const jr = () => s.jit[(k++) % s.jit.length];
    const blur = (v) => { g.filter = 'blur(' + (L * v).toFixed(2) + 'px)'; };
    // 脊线：从头后向尾，背向上弓；蜷身时尾部卷到腹下
    const segs = [];
    let p = [0, 0], dir = Math.PI + 0.08;
    const step = 0.12 + s.pose.arch * 0.14 + curl * 0.36;
    for (let i = 0; i < 5; i++) {
      const l = L * 0.12 * (1 - i * 0.07) * (1 - 0.15 * curl), h = L * 0.14 * (1 - i * 0.13);
      dir += step * (0.5 + i * 0.16);
      segs.push({ p, dir, l, h });
      p = polar(p, dir, l);
    }
    // 尾扇：三瓣，两侧浓、中间淡
    g.save();
    g.translate(p[0], p[1]);
    g.rotate(dir);
    blur(0.008);
    for (const [a, len, al] of [[-0.6, 0.15, 0.8], [0.55, 0.14, 0.72], [0, 0.11, 0.5]]) {
      g.save();
      g.rotate(a + (jr() - 0.5) * 0.15);
      g.fillStyle = ink(al);
      g.beginPath();
      g.moveTo(0, 0);
      g.quadraticCurveTo(L * len * 0.5, -L * 0.055, L * len, -L * 0.02);
      g.quadraticCurveTo(L * len * 1.05, L * 0.03, L * len * 0.7, L * 0.04);
      g.quadraticCurveTo(L * len * 0.3, L * 0.03, 0, 0);
      g.fill();
      g.restore();
    }
    g.restore();
    // 腹节：从尾往头画，前节压住后节；先铺淡墨，再在背侧压一笔浓墨
    const segShape = (l, h, k2) => {
      g.beginPath();
      g.moveTo(-l * 0.05, -h);
      g.quadraticCurveTo(l * 0.5, -h * 1.12, l * 1.05, -h * 0.85);
      g.quadraticCurveTo(l * (1.0 - 0.2 * k2), h * (0.1 - 0.5 * k2), l * (0.72 - 0.1 * k2), h * (0.62 - 0.9 * k2));
      g.quadraticCurveTo(l * 0.3, h * (0.82 - 1.0 * k2), 0, h * (0.78 - 1.0 * k2));
      g.quadraticCurveTo(-l * 0.12, -h * k2 * 0.5, -l * 0.05, -h);
    };
    for (let i = segs.length - 1; i >= 0; i--) {
      const { p: q, dir: d, l, h } = segs[i];
      g.save();
      g.translate(q[0], q[1]);
      g.rotate(d);
      // 此坐标系里 +x 朝尾，-y 为背侧
      blur(0.007);
      segShape(l, h, 0);
      g.fillStyle = ink(0.34 + 0.12 * jr());
      g.fill();
      g.strokeStyle = ink(0.3);
      g.lineWidth = L * 0.01;
      g.stroke();
      blur(0.005);
      segShape(l * 0.98, h, 0.55 + 0.15 * jr());
      g.fillStyle = ink(0.62 + 0.25 * jr());
      g.fill();
      // 腹下游泳足一小撇
      g.filter = 'none';
      g.strokeStyle = ink(0.75);
      g.lineCap = 'round';
      g.lineWidth = Math.max(1.2, L * 0.017);
      g.beginPath();
      g.moveTo(l * 0.45, h * 0.6);
      g.quadraticCurveTo(l * 0.55, h * 1.1, l * 0.9, h * 1.35);
      g.stroke();
      g.restore();
    }
    // 节间白缝：只擦背侧一半
    g.filter = 'none';
    g.globalCompositeOperation = 'destination-out';
    g.strokeStyle = 'rgba(0,0,0,0.8)';
    g.lineWidth = Math.max(1, L * 0.013);
    for (let i = 1; i < segs.length; i++) {
      const { p: q, dir: d, h } = segs[i];
      const n = d - Math.PI / 2;
      g.beginPath();
      g.moveTo(q[0] + Math.cos(n) * h * 1.1, q[1] + Math.sin(n) * h * 1.1);
      g.lineTo(q[0] + Math.cos(n) * h * 0.1, q[1] + Math.sin(n) * h * 0.1);
      g.stroke();
    }
    g.globalCompositeOperation = 'source-over';
    // 头胸：前尖后宽一团淡墨，背后上方压浓墨，中间一道淡痕透出纸色
    const headShape = () => {
      g.beginPath();
      g.moveTo(-L * 0.03, -L * 0.135);
      g.bezierCurveTo(L * 0.12, -L * 0.2, L * 0.3, -L * 0.13, L * 0.46, -L * 0.05);
      g.bezierCurveTo(L * 0.33, 0, L * 0.18, L * 0.1, L * 0.01, L * 0.125);
      g.bezierCurveTo(-L * 0.06, L * 0.06, -L * 0.07, -L * 0.07, -L * 0.03, -L * 0.135);
    };
    blur(0.007);
    headShape();
    g.fillStyle = ink(0.42 + 0.1 * jr());
    g.fill();
    g.strokeStyle = ink(0.3);
    g.lineWidth = L * 0.01;
    g.stroke();
    blur(0.006);
    g.fillStyle = ink(0.88);
    g.beginPath();
    g.moveTo(-L * 0.03, -L * 0.13);
    g.bezierCurveTo(L * 0.12, -L * 0.19, L * 0.28, -L * 0.13, L * 0.42, -L * 0.055);
    g.bezierCurveTo(L * 0.3, -L * 0.05, L * 0.15, -L * 0.03, -L * 0.04, L * 0.0);
    g.fill();
    g.fillStyle = ink(0.95);
    g.beginPath();
    g.moveTo(L * 0.03, -L * 0.05);
    g.quadraticCurveTo(L * 0.14, -L * 0.1, L * 0.27, -L * 0.07);
    g.quadraticCurveTo(L * 0.15, -L * 0.04, L * 0.03, -L * 0.05);
    g.fill();
    g.filter = 'none';
    g.globalCompositeOperation = 'destination-out';
    g.strokeStyle = 'rgba(0,0,0,0.5)';
    g.lineWidth = L * 0.02;
    g.beginPath();
    g.moveTo(L * 0.0, L * 0.03);
    g.quadraticCurveTo(L * 0.14, L * 0.02, L * 0.3, -L * 0.02);
    g.stroke();
    // 飞白：在墨上随机擦出细小白丝
    for (let n = 0; n < 60; n++) {
      const x = -L * (0.9 * jr()) + L * 0.45 * jr(), y = (jr() - 0.5) * L * 0.4, len = L * (0.01 + 0.03 * jr()), a = jr() * 0.6 - 0.3;
      g.strokeStyle = 'rgba(0,0,0,' + (0.25 + 0.45 * jr()).toFixed(2) + ')';
      g.lineWidth = Math.max(0.5, L * 0.004);
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
      g.stroke();
    }
    g.globalCompositeOperation = 'source-over';
    // 额剑与双眼
    g.fillStyle = ink(0.9);
    g.beginPath();
    g.moveTo(L * 0.34, -L * 0.085);
    g.lineTo(L * 0.6, -L * 0.15);
    g.lineTo(L * 0.36, -L * 0.055);
    g.fill();
    g.strokeStyle = ink(0.97);
    g.lineCap = 'round';
    g.lineWidth = Math.max(2, L * 0.03);
    g.beginPath();
    g.moveTo(L * 0.37, -L * 0.035);
    g.lineTo(L * 0.45, -L * 0.075);
    g.stroke();
    g.lineWidth = Math.max(1.6, L * 0.024);
    g.beginPath();
    g.moveTo(L * 0.38, -L * 0.005);
    g.lineTo(L * 0.46, L * 0.005);
    g.stroke();
    return { c, ox, oy, W, H };
  }

  // 每帧画：长须、步足、长钳是细线实时画，虾身贴缓存图
  drawShrimp(ctx, s, t) {
    const L = s.L;
    const ink = (a) => 'rgba(28,26,23,' + Math.min(1, a) + ')';
    const polar = (p, a, r) => [p[0] + Math.cos(a) * r, p[1] + Math.sin(a) * r];
    const line = (pts, w, a) => {
      ctx.strokeStyle = ink(a);
      ctx.lineWidth = w;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.stroke();
    };
    const fwd = s.vx * Math.cos(s.ang) + s.vy * Math.sin(s.ang);
    const stream = Math.max(0, Math.min(1, -fwd / 320));
    const level = Math.min(3, Math.round(s.curl * 3));
    if (!s.sprites[level]) s.sprites[level] = this.renderBody(s, level / 3);
    const sp = s.sprites[level];
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.ang);
    ctx.scale(s.scale, s.scale * s.side);
    ctx.globalAlpha = s.alpha * s.tone;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const sw = Math.sin(t * 1.2 + s.phase) * 0.08, wob = Math.sin(t * 1.7 + s.phase) * 0.05;
    // 长须：两根拖到身后很远，一根过背、一根过腹；弹逃时被水流甩向前
    for (const k of [-1, 1]) {
      const reach = L * (2.3 + 0.6 * s.pose.ant), back = 1 - 2 * stream;
      const ex = L * 0.45 - back * reach, ey = k * L * (0.3 + 0.3 * s.pose.ant) + k * L * sw;
      ctx.strokeStyle = ink(0.7);
      ctx.lineWidth = Math.max(0.7, L * 0.008);
      ctx.beginPath();
      ctx.moveTo(L * 0.44, -L * 0.04);
      ctx.bezierCurveTo(L * (0.85 - 0.4 * stream), k * L * 0.1 - L * 0.1, L * 0.45 - back * reach * 0.35, k * L * 0.5, ex, ey);
      ctx.stroke();
    }
    // 短须：向前散开几根
    for (let k = 0; k < 4; k++) {
      line([[L * 0.44, -L * 0.03], polar([L * 0.44, -L * 0.03], -0.32 + k * 0.17 + sw * 0.6, L * (0.38 + 0.14 * (k % 2)))], Math.max(0.6, L * 0.006), 0.6);
    }
    // 长钳：三节折线，越往前越粗，末端一段浓墨钳掌加开叉钳指
    const claw = (base, a1, a2, a3, open, a, sc) => {
      const e1 = polar(base, a1, L * 0.36 * sc), e2 = polar(e1, a2, L * 0.32 * sc), e3 = polar(e2, a3, L * 0.34 * sc);
      line([base, e1], Math.max(1, L * 0.012), a * 0.85);
      line([e1, e2], Math.max(1.2, L * 0.016), a * 0.9);
      line([e2, e3], Math.max(2.6, L * 0.045), a);
      line([e3, polar(e3, a3 - open, L * 0.17 * sc)], Math.max(1.4, L * 0.02), a);
      line([e3, polar(e3, a3 + open * 0.7, L * 0.14 * sc)], Math.max(1.2, L * 0.017), a);
    };
    const ca = s.pose.claw, cs = s.curl;
    claw([L * 0.2, L * 0.06], 1.0 + ca * 0.4 - cs * 0.6, -0.5 + wob, -0.08 + ca * 0.2 - stream * 0.3, 0.35, 0.5, 0.92);
    // 步足：三笔折线
    for (let k = 0; k < 3; k++) {
      const b = [L * (0.06 + k * 0.07), L * 0.08], m = polar(b, 1.3 - k * 0.12 + wob, L * 0.14);
      line([b, m, polar(m, 2.1 - k * 0.1, L * 0.1)], Math.max(0.8, L * 0.009), 0.65);
    }
    ctx.drawImage(sp.c, -sp.ox, -sp.oy, sp.W, sp.H);
    claw([L * 0.24, L * 0.08], 0.8 + ca * 0.5 - cs * 0.6, -0.32 - wob, 0.04 + ca * 0.15 - stream * 0.3, 0.4, 0.95, 1);
    ctx.restore();
  }

  renderVals() {
    const accent = this.props.accent ?? '#a8352b';
    const motion = this.props.motion ?? true;
    // 挂轴卷起后露出后面的荷花图；点击切换，Tweaks 里可设初始状态
    const rolled = (this.state || {}).rolled ?? this.props.scrollRolled ?? false;
    // 放下挂轴时若有墨虾在外，先让虾游回画里，挂轴稍后再放下
    const wait = !rolled && (this.state || {}).shrimpOut ? 0.9 : 0;
    this.motionOn = motion;
    this.rolledNow = rolled;
    if (!this.hooks) {
      this.hooks = {
        canvas: (el) => { this.canvasEl = el; },
        lotus: (el) => { this.lotusEl = el; },
        click: (e) => this.startle(e.clientX, e.clientY)
      };
    }
    return {
      accent,
      accentWash: accent + '55',
      play: motion ? 'running' : 'paused',
      canvasRef: this.hooks.canvas,
      lotusRef: this.hooks.lotus,
      onPageClick: this.hooks.click,
      paperRows: rolled ? '0fr' : '1fr',
      rollDelay: wait + 's',
      rodH: rolled ? '30px' : '18px',
      // 卷动时地杆上方的纸面明暗，模拟纸弯进卷筒；首次点击前不播放
      curlAnim: !(this.state || {}).toggled ? 'none' : rolled ? 'curlUp' : 'curlDown',
      rolledPressed: rolled ? 'true' : 'false',
      scrollLabel: rolled ? '放下《爱莲说》挂轴' : '卷起《爱莲说》挂轴，看后面的荷花图',
      // 说明文字交叉淡入淡出：旧的随动画开始淡出，新的等卷完再出现
      capOpenOpacity: rolled ? '0' : '1',
      capOpenDelay: rolled ? '0s' : (2.4 + wait) + 's',
      capOpenHidden: rolled ? 'true' : 'false',
      capRolledOpacity: rolled ? '1' : '0',
      capRolledDelay: rolled ? '2.4s' : '0s',
      capRolledHidden: rolled ? 'false' : 'true',
      toggleScroll: () => this.setState({ rolled: !rolled, toggled: true,
        shrimpOut: !!(motion && this.pond && this.pond.shrimp.some((s) => s.mode !== 'hidden' && s.mode !== 'waiting')) }),
      cats: [
        { name: '唐诗', count: '366' },
        { name: '宋词', count: '282' },
        { name: '诗经楚辞', count: '305' },
        { name: '古文名篇', count: '7' },
        { name: '经文国学', count: '3' }
      ]
    };
  }
}
</script>
</body>

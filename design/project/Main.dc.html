<!doctype html>
<html lang="zh-CN">

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&amp;display=swap">
<style>
body{margin:0;background:#f3eee2}
a{color:#23211d}a:hover{color:#a8352b}
@keyframes inkBloom{0%{transform:scale(.12);opacity:0}30%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes inkDrift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,-3%) scale(1.07)}100%{transform:translate(-3%,2%) scale(.95)}}
@keyframes inkMorph{0%{border-radius:42% 58% 63% 37%/41% 44% 56% 59%}50%{border-radius:58% 42% 38% 62%/55% 61% 39% 45%}100%{border-radius:47% 53% 55% 45%/62% 38% 62% 38%}}
@keyframes scrollSway{0%{transform:rotate(-.45deg)}100%{transform:rotate(.45deg)}}
@keyframes mountainPan{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes mistBreath{0%,100%{opacity:.55}50%{opacity:.9}}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes curlUp{0%{opacity:0}8%{opacity:1}90%{opacity:1}100%{opacity:0}}
@keyframes curlDown{0%{opacity:0}8%{opacity:1}90%{opacity:1}100%{opacity:0}}
@keyframes fallIn{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>

<div onClick="{{onPageClick}}" style="position: relative; isolation: isolate; font-family: 'Noto Serif SC', 'Songti SC', serif; background: #f3eee2; color: #23211d; overflow: hidden">

  <section style="position: relative; min-height: 860px; box-sizing: border-box; padding: 0 6vw">

            <path transform="translate(1440 0)" d="M0 170 C140 120 220 60 340 90 C430 112 480 40 600 34 C720 28 780 120 880 128 C980 136 1040 70 1150 62 C1260 54 1330 140 1400 162 L1440 170 L1440 240 L0 240 Z" fill="#23211d" opacity=".06"></path>
          </svg>
        </div>
        <div style="position: absolute; left: 0; bottom: 0; width: 200%; height: 190px; animation: mountainPan 90s linear infinite; animation-play-state: {{play}}">
          <svg viewBox="0 0 2880 190" preserveAspectRatio="none" style="width: 100%; height: 100%; display: block">
            <path d="M0 150 C100 128 180 80 280 96 C380 112 420 150 520 140 C640 128 700 70 820 78 C940 86 990 146 1100 150 C1210 154 1290 112 1380 132 L1440 150 L1440 190 L0 190 Z" fill="#23211d" opacity=".11"></path>
            <path transform="translate(1440 0)" d="M0 150 C100 128 180 80 280 96 C380 112 420 150 520 140 C640 128 700 70 820 78 C940 86 990 146 1100 150 C1210 154 1290 112 1380 132 L1440 150 L1440 190 L0 190 Z" fill="#23211d" opacity=".11"></path>

          <div style="grid-area: 1 / 1; align-self: stretch; margin: 95px 20px 10px; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; justify-content: center; background: #e4dccb; border: 3px solid #3b2e24; box-shadow: 0 6px 14px rgba(35,33,29,.14), inset 0 0 0 1px rgba(80,66,48,.18)">
            <img ref="{{lotusRef}}" src="/_blob/ab75c63f186ed873d4bccc4c2214e52f" alt="吴冠中 1990 年所作荷花图" style="width: 100%; aspect-ratio: 1002 / 1024; display: block; box-shadow: 0 0 0 1px rgba(80,66,48,.25)">
          </div>
          <button type="button" onClick="{{toggleScroll}}" aria-pressed="{{rolledPressed}}" aria-label="{{scrollLabel}}" style="grid-area: 1 / 1; align-self: start; position: relative; width: 100%; margin: 0; padding: 0; border: none; background: none; cursor: pointer; display: block; transform-origin: 50% 0; animation: scrollSway 9s ease-in-out infinite alternate; animation-play-state: {{play}}">
            <svg viewBox="0 0 440 54" style="width: 100%; height: 54px; display: block" aria-hidden="true">

                  </span>
                </span>
              </span>
            </span>
            <span style="position: relative; display: block; width: calc(100% + 24px); margin-left: -12px; height: {{rodH}}; transition: height 2.8s cubic-bezier(.4,.1,.6,.9); transition-delay: {{rollDelay}}; border-radius: 8px; background: linear-gradient(90deg, #241b14 0, #3a2d22 22px, rgba(0,0,0,0) 22px, rgba(0,0,0,0) calc(100% - 22px), #3a2d22 calc(100% - 22px), #241b14 100%), linear-gradient(#e6dcc6, #cbc1aa 38%, #a59a82 78%, #8a7f6a); box-shadow: 0 6px 12px rgba(35,33,29,.18)">
              <span style="position: absolute; left: 26px; right: 26px; bottom: 100%; height: 44px; background: linear-gradient(rgba(35,33,29,0), rgba(35,33,29,.08) 45%, rgba(35,33,29,.30) 88%, rgba(250,244,230,.45)); opacity: 0; animation: {{curlAnim}} 2.8s cubic-bezier(.4,.1,.6,.9) both; animation-delay: {{rollDelay}}"></span>
            </span>
          </button>
        </div>
        <figcaption style="display: grid; text-align: center">
          <span aria-hidden="{{capOpenHidden}}" style="grid-area: 1 / 1; display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: {{capOpenOpacity}}; transition: opacity .5s ease {{capOpenDelay}}">

  <section id="shelf" style="position: relative; max-width: 960px; margin: 0 auto; padding: 24px 6vw 96px; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 30px; font-weight: 400; letter-spacing: .3em">从一首诗开始</h2>
      <p style="margin: 0; font-size: 15px; letter-spacing: .12em; color: #625c52">选好诗，选繁体或简体、有格或无格，即可生成小楷作品。</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <label for="poemSearch" style="font-size: 14px; letter-spacing: .2em; color: #4f4a43">搜索</label>
      <input id="poemSearch" type="search" placeholder="诗题、作者或名句" style="font-family: inherit; font-size: 18px; letter-spacing: .1em; padding: 14px 4px; border: none; border-bottom: 1px solid #23211d; background: transparent; color: #23211d; outline-offset: 4px">
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 12px 28px" role="list" aria-label="诗词分类">
      <sc-for list="{{cats}}" as="cat" hint-placeholder-count="5">
        <a href="Poems.dc.html" role="listitem" style="text-decoration: none; font-size: 16px; letter-spacing: .2em; padding: 10px 0; min-height: 44px; box-sizing: border-box">{{cat.name}}<span style="font-size: 13px; color: #625c52; letter-spacing: .05em; margin-left: 8px">{{cat.count}}</span></a>

  <footer id="about" style="max-width: 960px; margin: 0 auto; padding: 48px 6vw 64px; box-sizing: border-box; border-top: 1px solid rgba(35,33,29,.18); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 13px; letter-spacing: .15em; color: #625c52">
    <span>星树书房 · 个人非商业项目</span>
    <span>书法渲染：[待原作者授权后确认署名]</span>
  </footer>

  <canvas ref="{{underRef}}" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1"></canvas>
  <canvas ref="{{waterRef}}" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1"></canvas>
  <canvas ref="{{canvasRef}}" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4"></canvas>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#a8352b","options":["#a8352b","#8c2f28","#b4552d","#23211d"]},"motion":{"editor":"boolean","default":true},"scrollRolled":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1600}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.pond = { shrimp: [], src: [], last: 0, time: 0, wasRolled: null, root: null, ptr: null, live: false, water: null };
    // 常态微波：方向（度）、波长（px）、聚光强度、初相；几组细波交叠，水底就有缓慢漂移的焦散网
    // 聚光强度 = 水深 × 波高 × k²，换算成波高存起来
    this.depth = 90;
    this.amb = [[12, 120, 0.4, 0], [77, 95, 0.4, 1.7], [139, 77, 0.4, 4.1], [203, 58, 0.35, 2.6], [254, 105, 0.4, 5.3], [318, 48, 0.3, 0.9], [35, 66, 0.35, 3.3], [290, 84, 0.35, 2.0]].map(([deg, lam, focus, ph]) => {
      const r = deg * Math.PI / 180, k = 2 * Math.PI / lam;
      return [Math.cos(r), Math.sin(r), k, focus / (this.depth * k * k), 5 * Math.sqrt(k), ph];
    });
    this.onMove = (e) => this.stir(e);
    this.loop = (now) => { this.tickPond(now); this.raf = requestAnimationFrame(this.loop); };
    this.raf = requestAnimationFrame(this.loop);
  }
  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    const p = this.pond;
    if (p && p.root) p.root.removeEventListener('pointermove', this.onMove);
  }

  // 墨虾：挂轴卷起后从荷花图里游出，在水中随处游动；点击时尾扇连弹向后逃开，再伸直身子游到远处躲着；挂轴放下时游回画里消失
  makeShrimp() {
    // 大小、墨色、背向、身形各不相同：越大越浓，像近处的虾
    const near = Math.random(), arch = Math.random();
    return { x: 0, y: 0, vx: 0, vy: 0, ang: 0, prevAng: 0, turnRate: 0, L: 55 + 95 * Math.pow(near, 1.2),
      tone: 0.5 + 0.5 * near, side: Math.random() < 0.5 ? 1 : -1,
      pose: { arch, claw: Math.random() - 0.5, ant: Math.random() },
      jit: Array.from({ length: 256 }, () => Math.random()), spr: null,
      mode: 'hidden', t: 0, clock: 0, alpha: 0, scale: 0.35, kick: 0, phase: Math.random() * 10,
      // 弯曲度 bend：0 伸直，1 蜷紧；habit 是这只虾平时的弯度
      habit: 0.17 + 0.23 * arch, bend: 0.17 + 0.23 * arch, bendV: 0,
      padPh: Math.random() * 6, legPh: Math.random() * 6, swimHz: 5, limb: 1, yaw: 0, drift: 0,
      ph1: Math.random() * 6, ph2: Math.random() * 6, rx: 0, ry: 0, framed: false, hover: 0,
      wanderAng: 0, thrustIn: 0, flips: 0, flipIn: 0, power: 0, aim: 0, delay: 0, tx: 0, ty: 0,
      threatX: 0, threatY: 0, hx: 0, hy: 0, restFor: 0 };
  }

  tickPond(now) {
    const canvas = this.canvasEl, under = this.underEl, root = canvas && canvas.parentElement, img = this.lotusEl, p = this.pond;
    if (!canvas || !under || !root || !p) return;
    const dt = p.last ? Math.min(0.05, (now - p.last) / 1000) : 0;
    p.last = now;
    p.time = now / 1000;
    const t = p.time;
    const rr = root.getBoundingClientRect(), W = rr.width, H = rr.height, dpr = window.devicePixelRatio || 1;
    // 两层虾：水下一层画全身；荷花图画框内另在最上层画一遍，出画、回画时虾才能盖在画上
    const top = this.fitCanvas(canvas, W, H, dpr), low = this.fitCanvas(under, W, H, dpr);
    if (p.root !== root) {
      if (p.root) p.root.removeEventListener('pointermove', this.onMove);
      root.addEventListener('pointermove', this.onMove);
      p.root = root;
    }
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    p.live = this.motionOn && !reduce;
    if (!p.live) { this.clearWater(); return; }
    p.src = p.src.filter((r) => t - r.t0 < 4 * (0.45 + 1.4 * r.k));
    this.renderWater(W, H, t);
    if (!img) return;
    const ir = img.getBoundingClientRect(), fe = img.parentElement.getBoundingClientRect();
    const box = { x: ir.left - rr.left, y: ir.top - rr.top, w: ir.width, h: ir.height };
    const fr = { x: fe.left - rr.left, y: fe.top - rr.top, w: fe.width, h: fe.height };
    if (!p.shrimp.length) p.shrimp = Array.from({ length: 8 }, () => this.makeShrimp());
    if (this.rolledNow !== p.wasRolled) {
      if (this.rolledNow) {
        // 等挂轴卷完再出画；页面初始就是卷起状态时立即出画
        const wait = p.wasRolled === null ? 0.3 : 2.5;
        p.shrimp.forEach((s, i) => {
          if (s.mode === 'return' || s.mode === 'vanish') { s.mode = 'wander'; s.alpha = 1; s.scale = 1; s.wanderAng = s.ang; return; }
          if (s.mode === 'hidden') { s.mode = 'waiting'; s.delay = wait + i * 0.2 + Math.random() * 0.4; }
        });
      } else if (p.wasRolled) {
        p.shrimp.forEach((s) => {
          if (s.mode === 'waiting' || s.mode === 'hidden') { s.mode = 'hidden'; return; }
          s.mode = 'return';
          s.tx = box.x + box.w * (0.2 + 0.6 * Math.random());
          s.ty = box.y + box.h * (0.3 + 0.5 * Math.random());
        });
      }
      p.wasRolled = this.rolledNow;
    }
    for (const s of p.shrimp) this.stepShrimp(s, dt, box, fr, W, H);
    for (const s of p.shrimp) {
      if (s.alpha <= 0.01) continue;
      // 隔着起伏的水面看，虾随涟漪轻轻晃动（只影响画的位置）
      const g = this.waterGrad(s.x, s.y, t);
      s.rx = -g[0] * 18;
      s.ry = -g[1] * 18;
      this.drawShrimp(low, s, t);
      if (s.framed) {
        top.save();
        top.beginPath();
        top.rect(fr.x, fr.y, fr.w, fr.h);
        top.clip();
        this.drawShrimp(top, s, t);
        top.restore();
      }
    }
  }

  fitCanvas(c, W, H, dpr) {
    if (c.width !== Math.round(W * dpr) || c.height !== Math.round(H * dpr)) {
      c.width = Math.round(W * dpr);
      c.height = Math.round(H * dpr);
    }
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    return ctx;
  }

  // 水面：每个波源是一圈向外扩散、逐渐衰减的涟漪，和常态微波线性叠加；
  // 由水面坡度算明暗，由水面曲率算水底焦散（光被起伏水面聚拢成的亮纹）
  initWater(cv) {
    const gl = cv.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false, depth: false });
    if (!gl) return null;
    const num = (v) => v.toFixed(6);
    const amb = this.amb.map((a, i) => '  wave(vec2(' + num(a[0]) + ', ' + num(a[1]) + '), ' + num(a[2]) + ', ' + num(a[3]) + ', uPh[' + i + '], p, g, H);').join('\n');
    const fs = [
      '#ifdef GL_FRAGMENT_PRECISION_HIGH',
      'precision highp float;',
      '#else',
      'precision mediump float;',
      '#endif',
      'uniform vec2 uRes;',
      'uniform vec2 uScale;',
      'uniform float uPh[' + this.amb.length + '];',
      'uniform vec4 uSrc[32];',
      'void wave(vec2 dir, float k, float a, float ph, vec2 p, inout vec2 g, inout vec3 H) {',
      '  float s = k * dot(dir, p) + ph;',
      '  g += a * k * cos(s) * dir;',
      '  H -= a * k * k * sin(s) * vec3(dir.x * dir.x, dir.x * dir.y, dir.y * dir.y);',
      '}',
      'void main() {',
      '  vec2 p = vec2(gl_FragCoord.x, uRes.y * uScale.y - gl_FragCoord.y) / uScale;',
      '  vec2 g = vec2(0.0);',
      '  vec3 H = vec3(0.0);',
      amb,
      '  for (int i = 0; i < 32; i++) {',
      '    vec4 s = uSrc[i];',
      '    if (s.w <= 0.0) continue;',
      '    vec2 d = p - s.xy;',
      '    float r = max(length(d), 8.0);',
      '    float u = (r - 150.0 * s.z) / (22.0 + 30.0 * s.z);',
      '    if (abs(u) > 3.0) continue;',
      '    float k = 6.2832 / (24.0 + 22.0 * s.w);',
      '    float a = 1.6 * s.w * exp(-u * u - s.z / (0.45 + 1.4 * s.w)) / sqrt(1.0 + r / 50.0);',
      '    float ph = k * (r - 100.0 * s.z);',
      '    float f1 = a * k * cos(ph), f2 = -a * k * k * sin(ph), q = f1 / r;',
      '    vec2 n = d / r;',
      '    g += f1 * n;',
      '    H += vec3(f2 * n.x * n.x + q * (1.0 - n.x * n.x), (f2 - q) * n.x * n.y, f2 * n.y * n.y + q * (1.0 - n.y * n.y));',
      '  }',
      '  float D = ' + num(this.depth) + ';',
      '  float det = (1.0 - D * H.x) * (1.0 - D * H.z) - D * D * H.y * H.y;',
      '  float c = 1.0 / max(abs(det), 0.1);',
      '  float lit = clamp((c - 1.4) / 3.5, 0.0, 1.0);',
      '  float dim = clamp(1.0 - c, 0.0, 1.0);',
      '  float wa = 0.6 * lit;',
      '  float ia = 0.035 + 0.05 * dim;',
      '  gl_FragColor = vec4(vec3(1.0, 0.988, 0.95) * wa + vec3(0.11, 0.102, 0.09) * ia * (1.0 - wa), wa + ia * (1.0 - wa));',
      '}'
    ].join('\n');
    const vs = 'attribute vec2 aPos;\nvoid main() { gl_Position = vec4(aPos, 0.0, 1.0); }';
    const shader = (type, src) => {
      const o = gl.createShader(type);
      gl.shaderSource(o, src);
      gl.compileShader(o);
      return o;
    };
    const prog = gl.createProgram();
    gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      // 着色器编译失败时不画水面，墨虾照常；把原因打到控制台
      console.error('water shader:', gl.getProgramInfoLog(prog));
      return null;
    }
    gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const aPos = gl.getAttribLocation(prog, 'aPos');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
    return { cv, gl, prog, cleared: false, src: new Float32Array(128), ph: new Float32Array(this.amb.length),
      uRes: gl.getUniformLocation(prog, 'uRes'), uScale: gl.getUniformLocation(prog, 'uScale'),
      uPh: gl.getUniformLocation(prog, 'uPh'), uSrc: gl.getUniformLocation(prog, 'uSrc') };
  }

  renderWater(W, H, t) {
    const p = this.pond, cv = this.waterEl;
    if (!cv) return;
    if (!p.water || p.water.cv !== cv) p.water = this.initWater(cv) || { cv, gl: null };
    const wv = p.water, gl = wv.gl;
    if (!gl) return;
    // 页面很大时降低水面分辨率，像素总数控制在约 260 万
    const q = Math.min(1, Math.sqrt(2.6e6 / (W * H))), cw = Math.round(W * q), ch = Math.round(H * q);
    if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
    gl.viewport(0, 0, cw, ch);
    gl.uniform2f(wv.uRes, W, H);
    gl.uniform2f(wv.uScale, cw / W, ch / H);
    this.amb.forEach((a, i) => { wv.ph[i] = (a[5] - a[4] * t) % (Math.PI * 2); });
    gl.uniform1fv(wv.uPh, wv.ph);
    wv.src.fill(0);
    p.src.forEach((r, i) => { wv.src.set([r.x, r.y, t - r.t0, r.k], i * 4); });
    gl.uniform4fv(wv.uSrc, wv.src);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    wv.cleared = false;
  }

  clearWater() {
    const wv = this.pond.water;
    if (!wv || !wv.gl || wv.cleared) return;
    wv.gl.clearColor(0, 0, 0, 0);
    wv.gl.clear(wv.gl.COLOR_BUFFER_BIT);
    wv.cleared = true;
  }

  // 水面在 (x, y) 处的坡度，公式与着色器一致
  waterGrad(x, y, t) {
    let gx = 0, gy = 0;
    for (const [ax, ay, k, a, w, ph] of this.amb) {
      const c = a * k * Math.cos(k * (ax * x + ay * y) + ph - w * t);
      gx += c * ax;
      gy += c * ay;
    }
    for (const r of this.pond.src) {
      const age = t - r.t0, dx = x - r.x, dy = y - r.y, d = Math.max(8, Math.hypot(dx, dy));
      const u = (d - 150 * age) / (22 + 30 * age);
      if (Math.abs(u) > 3) continue;
      const k = 2 * Math.PI / (24 + 22 * r.k);
      const a = 1.6 * r.k * Math.exp(-u * u - age / (0.45 + 1.4 * r.k)) / Math.sqrt(1 + d / 50);
      const f1 = a * k * Math.cos(k * (d - 100 * age));
      gx += f1 * dx / d;
      gy += f1 * dy / d;
    }
    return [gx, gy];
  }

  // 新波源；满 32 个时挤掉此刻最弱的一个
  addRipple(x, y, k) {
    const p = this.pond, t = p.time;
    if (p.src.length >= 32) {
      let wi = 0, wv = Infinity;
      p.src.forEach((r, i) => {
        const v = r.k * Math.exp(-(t - r.t0) / (0.45 + 1.4 * r.k));
        if (v < wv) { wv = v; wi = i; }
      });
      p.src.splice(wi, 1);
    }
    p.src.push({ x, y, t0: t, k });
  }

  // 鼠标划过水面：沿轨迹每隔一段投一个小波源，连起来就是尾迹；附近的虾被水推开一点
  stir(e) {
    const p = this.pond;
    if (!p || !p.root || !p.live) return;
    const rr = p.root.getBoundingClientRect(), x = e.clientX - rr.left, y = e.clientY - rr.top, t = p.time, m = p.ptr;
    if (!m || t - m.t > 0.3) {
      this.addRipple(x, y, 0.25);
      p.ptr = { x, y, t };
      return;
    }
    const d = Math.hypot(x - m.x, y - m.y);
    if (d < 18 || t - m.t < 0.05) return;
    const k = Math.min(0.6, 0.12 + d / Math.max(t - m.t, 0.016) / 2500);
    this.addRipple(x, y, k);
    for (const s of p.shrimp) {
      if (s.mode !== 'wander' && s.mode !== 'rest') continue;
      const dx = s.x - x, dy = s.y - y, ds = Math.hypot(dx, dy);
      if (ds > 110 || ds < 1) continue;
      const push = 60 * k * (1 - ds / 110);
      s.vx += dx / ds * push;
      s.vy += dy / ds * push;
    }
    p.ptr = { x, y, t };
  }

  stepShrimp(s, dt, box, fr, W, H) {
    const TAU = Math.PI * 2;
    const turnTo = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    s.t += dt;
    s.clock += dt;
    if (s.mode === 'hidden') { s.alpha = 0; s.framed = false; return; }
    if (s.mode === 'waiting') {
      s.delay -= dt;
      if (s.delay > 0) return;
      s.mode = 'emerge';
      s.t = 0;
      s.framed = true;
      s.x = box.x + box.w * (0.15 + 0.7 * Math.random());
      s.y = box.y + box.h * (0.15 + 0.7 * Math.random());
      s.ang = s.prevAng = Math.atan2(s.y - (box.y + box.h / 2), s.x - (box.x + box.w / 2)) + (Math.random() - 0.5) * 0.8;
      s.vx = Math.cos(s.ang) * 40;
      s.vy = Math.sin(s.ang) * 40;
    }
    // 每个状态给出：阻力、目标弯曲度、小脚划动频率、小脚划动幅度
    let drag = 1.4, bendTo = s.habit, swim = 6, limb = 1;
    if (s.mode === 'emerge') {
      // 由淡变浓、由小变大，像从画面里浮出来，同时朝画外游
      const k = Math.min(1, s.t / 1.2);
      s.alpha = k;
      s.scale = 0.35 + 0.65 * k;
      s.vx += Math.cos(s.ang) * 150 * dt;
      s.vy += Math.sin(s.ang) * 150 * dt;
      drag = 0.9;
      swim = 8;
      if (k >= 1) { s.mode = 'wander'; s.wanderAng = s.ang; s.thrustIn = 0.4; }
    } else if (s.mode === 'wander') {
      // 一下一下划水前进，时而悬停、时而轻收尾巴后退；身体不停微微屈伸，被水带着侧漂；靠近页面边缘就掉头
      s.wanderAng += (Math.random() - 0.5) * 3 * dt;
      let want = s.wanderAng;
      const m = 90;
      if (s.x < m || s.x > W - m || s.y < m || s.y > H - m) {
        want = Math.atan2(H / 2 - s.y, W / 2 - s.x);
        s.wanderAng += turnTo(s.wanderAng, want) * 2 * dt;
      }
      s.ang += clamp(turnTo(s.ang, want), -1.6 * dt, 1.6 * dt);
      s.thrustIn -= dt;
      if (s.thrustIn <= 0) {
        const r = Math.random();
        if (r < 0.22) {
          s.hover = 1;
          s.thrustIn = 1.2 + Math.random() * 2.2;
        } else if (r < 0.34) {
          const push = (60 + Math.random() * 40) * s.L / 90;
          s.vx -= Math.cos(s.ang) * push;
          s.vy -= Math.sin(s.ang) * push;
          s.bendV += 9;
          s.hover = 0;
          s.thrustIn = 0.6 + Math.random() * 0.8;
        } else {
          const push = (45 + Math.random() * 60) * s.L / 90;
          s.vx += Math.cos(s.ang) * push;
          s.vy += Math.sin(s.ang) * push;
          s.kick = 1;
          s.hover = 0;
          s.thrustIn = 0.5 + Math.random() * 1.2;
        }
      }
      s.drift += ((Math.random() - 0.5) * 2 - s.drift) * Math.min(1, 1.5 * dt);
      const side = s.drift * 25 * s.L / 90 * dt;
      s.vx -= Math.sin(s.ang) * side;
      s.vy += Math.cos(s.ang) * side;
      bendTo = s.habit + 0.14 * Math.sin(s.clock * 0.9 + s.ph1) + 0.07 * Math.sin(s.clock * 2.3 + s.ph2) - 0.12 * s.kick;
      swim = s.hover ? 3.5 : 5.5 + 3.5 * s.kick;
    } else if (s.mode === 'flee') {
      // 头先转向惊扰处，尾扇猛收、身体弓紧，整只虾向后弹出；连弹几下，一下比一下弱，小脚收拢
      drag = 3.2;
      bendTo = 0.45;
      swim = 0;
      limb = 0;
      if (s.aim > 0) { s.aim -= dt; s.ang += clamp(turnTo(s.ang, s.threatAng), -20 * dt, 20 * dt); }
      s.flipIn -= dt;
      if (s.flips > 0 && s.flipIn <= 0) {
        s.vx -= Math.cos(s.ang) * s.power;
        s.vy -= Math.sin(s.ang) * s.power;
        s.bend = 1;
        s.bendV = 0;
        this.addRipple(s.x - Math.cos(s.ang) * s.L * 0.5, s.y - Math.sin(s.ang) * s.L * 0.5, Math.min(0.7, s.power / 1300));
        s.power *= 0.6;
        s.flips -= 1;
        s.flipIn = 0.17 + Math.random() * 0.06;
      }
      if (s.flips === 0 && s.flipIn < -0.25) { s.mode = 'hide'; s.t = 0; this.pickHaven(s, W, H, fr); }
    } else if (s.mode === 'hide') {
      // 转身伸直，游泳足快划，游到远离惊扰处的地方
      const dx = s.hx - s.x, dy = s.hy - s.y, dist = Math.hypot(dx, dy), off = turnTo(s.ang, Math.atan2(dy, dx));
      s.ang += clamp(off, -5 * dt, 5 * dt);
      const sp = (110 + 140 * Math.min(1, dist / 250)) * s.L / 90 * Math.max(0, Math.cos(off));
      s.vx += (Math.cos(s.ang) * sp - s.vx) * Math.min(1, 2.5 * dt);
      s.vy += (Math.sin(s.ang) * sp - s.vy) * Math.min(1, 2.5 * dt);
      drag = 0;
      bendTo = 0.02;
      swim = 10;
      if (dist < 30 || s.t > 7) { s.mode = 'rest'; s.t = 0; s.restFor = 1.2 + Math.random() * 1.5; }
    } else if (s.mode === 'rest') {
      // 到了安全处停下，身子慢慢放松回平时的弯度
      drag = 2.4;
      swim = 3;
      if (s.t > s.restFor) { s.mode = 'wander'; s.wanderAng = s.ang; s.thrustIn = 0.3 + Math.random() * 0.6; }
    } else if (s.mode === 'return') {
      // 主动游回画里：头朝目标，伸直身子，越远游得越快
      const dist = Math.hypot(s.tx - s.x, s.ty - s.y);
      s.framed = true;
      s.ang += clamp(turnTo(s.ang, Math.atan2(s.ty - s.y, s.tx - s.x)), -8 * dt, 8 * dt);
      const sp = clamp(dist / 0.7, 420, 1500);
      s.vx += (Math.cos(s.ang) * sp - s.vx) * Math.min(1, 6 * dt);
      s.vy += (Math.sin(s.ang) * sp - s.vy) * Math.min(1, 6 * dt);
      s.kick = 1;
      drag = 0;
      bendTo = 0.05;
      swim = 10;
      if (dist < 40) { s.mode = 'vanish'; s.t = 0; }
    } else if (s.mode === 'vanish') {
      const k = Math.min(1, s.t / 0.45);
      s.alpha = 1 - k;
      s.scale = 1 - 0.6 * k;
      drag = 4;
      bendTo = 0.05;
      swim = 10;
      if (k >= 1) s.mode = 'hidden';
    }
    const f = Math.exp(-drag * dt);
    s.vx *= f;
    s.vy *= f;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    if (s.mode === 'flee' || s.mode === 'wander' || s.mode === 'hide' || s.mode === 'rest') {
      if (s.x < 10 || s.x > W - 10) { s.x = clamp(s.x, 10, W - 10); s.vx *= -0.3; }
      if (s.y < 10 || s.y > H - 10) { s.y = clamp(s.y, 10, H - 10); s.vy *= -0.3; }
      // 出画后虾身离开画框，就只在水下那层画；之后再游到画下面会被画挡住
      if (s.framed) {
        const ox = Math.max(fr.x - s.x, 0, s.x - fr.x - fr.w), oy = Math.max(fr.y - s.y, 0, s.y - fr.y - fr.h);
        if (Math.hypot(ox, oy) > s.L * 0.8) s.framed = false;
      }
    }
    // 身体屈伸：弹簧追目标弯度，惊逃时最硬最快，歇下时最软
    const K = s.mode === 'flee' ? 160 : s.mode === 'rest' ? 16 : 40, D = 1.6 * Math.sqrt(K);
    const n = Math.ceil(dt / 0.01);
    for (let i = 0; i < n; i++) {
      s.bendV += ((bendTo - s.bend) * K - s.bendV * D) * (dt / n);
      s.bend = clamp(s.bend + s.bendV * (dt / n), 0, 1);
    }
    s.swimHz += (swim - s.swimHz) * Math.min(1, 4 * dt);
    s.limb += (limb - s.limb) * Math.min(1, 8 * dt);
    s.padPh += TAU * s.swimHz * dt;
    s.legPh += TAU * s.swimHz * 0.6 * dt;
    const yawTo = s.mode === 'wander' || s.mode === 'rest' ? 0.06 * Math.sin(s.clock * 1.7 + s.ph1) : 0;
    s.yaw += (yawTo - s.yaw) * Math.min(1, 5 * dt);
    s.kick = Math.max(0, s.kick - dt * 2);
    if (dt > 0) s.turnRate += (turnTo(s.prevAng, s.ang) / dt - s.turnRate) * Math.min(1, 8 * dt);
    s.prevAng = s.ang;
  }

  // 安全处：随机取一些点，挑离惊扰处远、离自己不太远、游过去又不用钻到荷花图下面的
  pickHaven(s, W, H, fr) {
    const underArt = (x, y) => x > fr.x - 60 && x < fr.x + fr.w + 60 && y > fr.y - 60 && y < fr.y + fr.h + 60;
    // 已经被弹到画下面的，只要目标在画外就行，游出来就看得见
    const startIn = underArt(s.x, s.y);
    let best = null, bestScore = -Infinity;
    for (let i = 0; i < 20; i++) {
      const x = 110 + Math.random() * Math.max(1, W - 220), y = 110 + Math.random() * Math.max(1, H - 220);
      let blocked = underArt(x, y);
      for (let k = 1; k < 10 && !blocked && !startIn; k++) blocked = underArt(s.x + (x - s.x) * k / 10, s.y + (y - s.y) * k / 10);
      if (blocked) continue;
      const score = Math.min(650, Math.hypot(x - s.threatX, y - s.threatY)) - 0.25 * Math.hypot(x - s.x, y - s.y) + 60 * Math.random();
      if (score > bestScore) { bestScore = score; best = [x, y]; }
    }
    if (!best) {
      const a = Math.atan2(s.y - s.threatY, s.x - s.threatX);
      best = [Math.max(60, Math.min(W - 60, s.x + Math.cos(a) * 300)), Math.max(60, Math.min(H - 60, s.y + Math.sin(a) * 300))];
    }
    s.hx = best[0];
    s.hy = best[1];
  }

  startle(clientX, clientY) {
    const p = this.pond, root = this.canvasEl && this.canvasEl.parentElement;
    if (!p || !root || !p.live) return;
    const rr = root.getBoundingClientRect(), cx = clientX - rr.left, cy = clientY - rr.top;
    this.addRipple(cx, cy, 1);
    for (const s of p.shrimp) {
      if (s.mode !== 'wander' && s.mode !== 'flee' && s.mode !== 'emerge' && s.mode !== 'hide' && s.mode !== 'rest') continue;
      const d = Math.hypot(s.x - cx, s.y - cy);
      if (d > 260) continue;
      s.mode = 'flee';
      s.alpha = 1;
      s.scale = 1;
      s.threatX = cx;
      s.threatY = cy;
      s.threatAng = Math.atan2(cy - s.y, cx - s.x);
      s.aim = 0.08;
      s.flips = d < 140 ? 3 : 2;
      s.power = 300 + 650 * (1 - d / 260);
      s.flipIn = 0.06 + Math.random() * 0.05;
    }
  }

  // 虾身拆成头胸、5 个腹节、尾扇各一张小图，只画一次；每帧按弯曲度绕关节转动拼起来。
  // 每张图的画法沿用：淡墨打底、背侧压浓墨、节间留白缝、再擦出飞白
  buildSprites(s) {
    const L = s.L, R = 2;
    const ink = (a) => 'rgba(28,26,23,' + Math.min(1, a) + ')';
    let n = 0;
    const jr = () => s.jit[(n++) % s.jit.length];
    const blur = (g, v) => { g.filter = 'blur(' + (L * v).toFixed(2) + 'px)'; };
    // 在局部坐标 [x0,x1]×[y0,y1] 里画一张小图，四周留出模糊的余量
    const sprite = (x0, y0, x1, y1, paint) => {
      const pad = L * 0.04, c = document.createElement('canvas');
      x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
      c.width = Math.ceil((x1 - x0) * R);
      c.height = Math.ceil((y1 - y0) * R);
      const g = c.getContext('2d');
      g.scale(R, R);
      g.translate(-x0, -y0);
      g.lineCap = 'round';
      paint(g);
      return { c, x0, y0, sw: x1 - x0, sh: y1 - y0 };
    };
    // 飞白：在墨上随机擦出细小白丝，数量按面积
    const flyWhite = (g, x0, y0, x1, y1) => {
      g.filter = 'none';
      g.globalCompositeOperation = 'destination-out';
      const count = Math.round(111 * (x1 - x0) * (y1 - y0) / (L * L));
      for (let i = 0; i < count; i++) {
        const x = x0 + (x1 - x0) * jr(), y = y0 + (y1 - y0) * jr(), len = L * (0.01 + 0.03 * jr()), a = jr() * 0.6 - 0.3;
        g.strokeStyle = 'rgba(0,0,0,' + (0.25 + 0.45 * jr()).toFixed(2) + ')';
        g.lineWidth = Math.max(0.5, L * 0.004);
        g.beginPath();
        g.moveTo(x, y);
        g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
        g.stroke();
      }
      g.globalCompositeOperation = 'source-over';
    };
    // 节间白缝：只擦背侧一半，相邻两节在关节处各擦一道
    const seam = (g, x, h) => {
      g.filter = 'none';
      g.globalCompositeOperation = 'destination-out';
      g.strokeStyle = 'rgba(0,0,0,0.8)';
      g.lineWidth = Math.max(1, L * 0.013);
      g.beginPath();
      g.moveTo(x, -h * 1.1);
      g.lineTo(x, -h * 0.1);
      g.stroke();
      g.globalCompositeOperation = 'source-over';
    };
    // 腹节：局部坐标 +x 朝尾，-y 为背侧
    const segShape = (g, l, h, k2) => {
      g.beginPath();
      g.moveTo(-l * 0.05, -h);
      g.quadraticCurveTo(l * 0.5, -h * 1.12, l * 1.05, -h * 0.85);
      g.quadraticCurveTo(l * (1.0 - 0.2 * k2), h * (0.1 - 0.5 * k2), l * (0.72 - 0.1 * k2), h * (0.62 - 0.9 * k2));
      g.quadraticCurveTo(l * 0.3, h * (0.82 - 1.0 * k2), 0, h * (0.78 - 1.0 * k2));
      g.quadraticCurveTo(-l * 0.12, -h * k2 * 0.5, -l * 0.05, -h);
    };
    const segs = [];
    for (let i = 0; i < 5; i++) segs.push({ l: L * 0.12 * (1 - i * 0.07), h: L * 0.14 * (1 - i * 0.13) });
    segs.forEach((sg, i) => {
      const { l, h } = sg;
      sg.img = sprite(-0.5 * l, -1.2 * h, 1.15 * l, 0.95 * h, (g) => {
        const base = ink(0.34 + 0.12 * jr());
        blur(g, 0.007);
        // 前端垫一片淡墨伸进前一节底下：身子弓起时，节与节之间背侧不露缝
        g.fillStyle = base;
        g.beginPath();
        g.moveTo(l * 0.3, -h * 1.02);
        g.quadraticCurveTo(-l * 0.2, -h * 1.08, -l * 0.42, -h * 0.7);
        g.lineTo(-l * 0.3, h * 0.35);
        g.lineTo(l * 0.3, h * 0.5);
        g.closePath();
        g.fill();
        segShape(g, l, h, 0);
        g.fill();
        g.strokeStyle = ink(0.3);
        g.lineWidth = L * 0.01;
        g.stroke();
        blur(g, 0.005);
        segShape(g, l * 0.98, h, 0.55 + 0.15 * jr());
        g.fillStyle = ink(0.62 + 0.25 * jr());
        g.fill();
        if (i > 0) seam(g, 0, h);
        if (i < 4) seam(g, l, segs[i + 1].h);
        flyWhite(g, -0.1 * l, -h, l, 0.6 * h);
      });
    });
    // 尾扇：三瓣，两侧浓、中间淡
    const fan = sprite(-0.03 * L, -0.15 * L, 0.19 * L, 0.15 * L, (g) => {
      blur(g, 0.008);
      for (const [a, len, al] of [[-0.6, 0.15, 0.8], [0.55, 0.14, 0.72], [0, 0.11, 0.5]]) {
        g.save();
        g.rotate(a + (jr() - 0.5) * 0.15);
        g.fillStyle = ink(al);
        g.beginPath();
        g.moveTo(0, 0);
        g.quadraticCurveTo(L * len * 0.5, -L * 0.055, L * len, -L * 0.02);
        g.quadraticCurveTo(L * len * 1.05, L * 0.03, L * len * 0.7, L * 0.04);
        g.quadraticCurveTo(L * len * 0.3, L * 0.03, 0, 0);
        g.fill();
        g.restore();
      }
      flyWhite(g, 0, -0.08 * L, 0.15 * L, 0.08 * L);
    });
    // 头胸：前尖后宽一团淡墨，背后上方压浓墨，中间一道淡痕透出纸色；再加额剑与双眼
    const head = sprite(-0.1 * L, -0.22 * L, 0.62 * L, 0.15 * L, (g) => {
      const headShape = () => {
        g.beginPath();
        g.moveTo(-L * 0.03, -L * 0.135);
        g.bezierCurveTo(L * 0.12, -L * 0.2, L * 0.3, -L * 0.13, L * 0.46, -L * 0.05);
        g.bezierCurveTo(L * 0.33, 0, L * 0.18, L * 0.1, L * 0.01, L * 0.125);
        g.bezierCurveTo(-L * 0.06, L * 0.06, -L * 0.07, -L * 0.07, -L * 0.03, -L * 0.135);
      };
      blur(g, 0.007);
      headShape();
      g.fillStyle = ink(0.42 + 0.1 * jr());
      g.fill();
      g.strokeStyle = ink(0.3);
      g.lineWidth = L * 0.01;
      g.stroke();
      blur(g, 0.006);
      g.fillStyle = ink(0.88);
      g.beginPath();
      g.moveTo(-L * 0.03, -L * 0.13);
      g.bezierCurveTo(L * 0.12, -L * 0.19, L * 0.28, -L * 0.13, L * 0.42, -L * 0.055);
      g.bezierCurveTo(L * 0.3, -L * 0.05, L * 0.15, -L * 0.03, -L * 0.04, L * 0.0);
      g.fill();
      g.fillStyle = ink(0.95);
      g.beginPath();
      g.moveTo(L * 0.03, -L * 0.05);
      g.quadraticCurveTo(L * 0.14, -L * 0.1, L * 0.27, -L * 0.07);
      g.quadraticCurveTo(L * 0.15, -L * 0.04, L * 0.03, -L * 0.05);
      g.fill();
      g.filter = 'none';
      g.globalCompositeOperation = 'destination-out';
      g.strokeStyle = 'rgba(0,0,0,0.5)';
      g.lineWidth = L * 0.02;
      g.beginPath();
      g.moveTo(L * 0.0, L * 0.03);
      g.quadraticCurveTo(L * 0.14, L * 0.02, L * 0.3, -L * 0.02);
      g.stroke();
      g.globalCompositeOperation = 'source-over';
      flyWhite(g, -0.05 * L, -0.18 * L, 0.45 * L, 0.12 * L);
      g.fillStyle = ink(0.9);
      g.beginPath();
      g.moveTo(L * 0.34, -L * 0.085);
      g.lineTo(L * 0.6, -L * 0.15);
      g.lineTo(L * 0.36, -L * 0.055);
      g.fill();
      g.strokeStyle = ink(0.97);
      g.lineWidth = Math.max(2, L * 0.03);
      g.beginPath();
      g.moveTo(L * 0.37, -L * 0.035);
      g.lineTo(L * 0.45, -L * 0.075);
      g.stroke();
      g.lineWidth = Math.max(1.6, L * 0.024);
      g.beginPath();
      g.moveTo(L * 0.38, -L * 0.005);
      g.lineTo(L * 0.46, L * 0.005);
      g.stroke();
    });
    return { segs, fan, head };
  }

  // 每帧画：长须、长钳、步足、游泳足是细线实时画；虾身按弯曲度把分节小图拼起来
  drawShrimp(ctx, s, t) {
    const L = s.L;
    const ink = (a) => 'rgba(28,26,23,' + Math.min(1, a) + ')';
    const polar = (p, a, r) => [p[0] + Math.cos(a) * r, p[1] + Math.sin(a) * r];
    const line = (pts, w, a) => {
      ctx.strokeStyle = ink(a);
      ctx.lineWidth = w;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.stroke();
    };
    if (!s.spr) s.spr = this.buildSprites(s);
    const spr = s.spr, tuck = 1 - s.limb;
    const fwd = s.vx * Math.cos(s.ang) + s.vy * Math.sin(s.ang);
    const stream = Math.max(0, Math.min(1, -fwd / 320));
    ctx.save();
    ctx.translate(s.x + s.rx, s.y + s.ry);
    ctx.rotate(s.ang + s.yaw);
    ctx.scale(s.scale, s.scale * s.side);
    ctx.globalAlpha = s.alpha * s.tone;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const sw = Math.sin(t * 1.2 + s.phase) * 0.08, wob = Math.sin(t * 1.7 + s.phase) * 0.05;
    // 长须：两根拖到身后很远，一根过背、一根过腹；弹逃时被水流甩向前
    for (const k of [-1, 1]) {
      const reach = L * (2.3 + 0.6 * s.pose.ant), back = 1 - 2 * stream;
      const ex = L * 0.45 - back * reach, ey = k * L * (0.3 + 0.3 * s.pose.ant) + k * L * sw;
      ctx.strokeStyle = ink(0.7);
      ctx.lineWidth = Math.max(0.7, L * 0.008);
      ctx.beginPath();
      ctx.moveTo(L * 0.44, -L * 0.04);
      ctx.bezierCurveTo(L * (0.85 - 0.4 * stream), k * L * 0.1 - L * 0.1, L * 0.45 - back * reach * 0.35, k * L * 0.5, ex, ey);
      ctx.stroke();
    }
    // 短须：向前散开几根
    for (let k = 0; k < 4; k++) {
      line([[L * 0.44, -L * 0.03], polar([L * 0.44, -L * 0.03], -0.32 + k * 0.17 + sw * 0.6, L * (0.38 + 0.14 * (k % 2)))], Math.max(0.6, L * 0.006), 0.6);
    }
    // 长钳：三节折线，越往前越粗，末端一段浓墨钳掌加开叉钳指；身子蜷紧时收向胸前
    const claw = (base, a1, a2, a3, open, a, sc) => {
      const e1 = polar(base, a1, L * 0.36 * sc), e2 = polar(e1, a2, L * 0.32 * sc), e3 = polar(e2, a3, L * 0.34 * sc);
      line([base, e1], Math.max(1, L * 0.012), a * 0.85);
      line([e1, e2], Math.max(1.2, L * 0.016), a * 0.9);
      line([e2, e3], Math.max(2.6, L * 0.045), a);
      line([e3, polar(e3, a3 - open, L * 0.17 * sc)], Math.max(1.4, L * 0.02), a);
      line([e3, polar(e3, a3 + open * 0.7, L * 0.14 * sc)], Math.max(1.2, L * 0.017), a);
    };
    const ca = s.pose.claw, cs = Math.max(0, Math.min(1, (s.bend - 0.35) / 0.65));
    claw([L * 0.2, L * 0.06], 1.0 + ca * 0.4 - cs * 0.6, -0.5 + wob, -0.08 + ca * 0.2 - stream * 0.3, 0.35, 0.5, 0.92);
    // 步足：三笔折线，交替轮划；惊逃时收向腹下
    for (let k = 0; k < 3; k++) {
      const ph = s.legPh + k * 1.4;
      const b = [L * (0.06 + k * 0.07), L * 0.08], m = polar(b, 1.3 - k * 0.12 + 0.35 * s.limb * Math.sin(ph) + 0.6 * tuck, L * 0.14);
      line([b, m, polar(m, 2.1 - k * 0.1 + 0.3 * s.limb * Math.sin(ph + 0.9) + 0.5 * tuck, L * 0.1)], Math.max(0.8, L * 0.009), 0.65);
    }
    // 脊线：从头后向尾，弯曲度 bend 连续决定每个关节的转角，蜷紧时各节略微套叠
    const step = 0.02 + 0.6 * s.bend, shrink = 1 - 0.12 * s.bend, joints = [];
    let p = [0, 0], dir = Math.PI + 0.08;
    for (let i = 0; i < 5; i++) {
      dir += step * (0.5 + i * 0.16);
      joints.push([p, dir]);
      p = polar(p, dir, spr.segs[i].l * shrink);
    }
    // 游泳足：每节腹下一对，由尾向头依次划水，远侧一只淡些
    for (let i = 0; i < 5; i++) {
      const [q, d] = joints[i], { l, h } = spr.segs[i];
      ctx.save();
      ctx.translate(q[0], q[1]);
      ctx.rotate(d);
      for (const [off, al, wd] of [[0.6, 0.35, 0.7], [0, 0.75, 1]]) {
        const ph = s.padPh + (4 - i) * 0.9 + off, b = [l * 0.45, h * 0.6], len = h * 0.85;
        const a0 = 1.1 + 0.55 * s.limb * Math.sin(ph) - 0.6 * tuck;
        const mid = polar(b, a0 - 0.35 * s.limb * Math.cos(ph), len * 0.55), tip = polar(b, a0, len);
        ctx.strokeStyle = ink(al);
        ctx.lineWidth = Math.max(1.2, L * 0.017) * wd;
        ctx.beginPath();
        ctx.moveTo(b[0], b[1]);
        ctx.quadraticCurveTo(mid[0], mid[1], tip[0], tip[1]);
        ctx.stroke();
      }
      ctx.restore();
    }
    const put = (im, q, d) => {
      ctx.save();
      ctx.translate(q[0], q[1]);
      ctx.rotate(d);
      ctx.drawImage(im.c, im.x0, im.y0, im.sw, im.sh);
      ctx.restore();
    };
    put(spr.fan, p, dir);
    for (let i = 4; i >= 0; i--) put(spr.segs[i].img, joints[i][0], joints[i][1]);
    put(spr.head, [0, 0], 0);
    claw([L * 0.24, L * 0.08], 0.8 + ca * 0.5 - cs * 0.6, -0.32 - wob, 0.04 + ca * 0.15 - stream * 0.3, 0.4, 0.95, 1);
    ctx.restore();
  }

  renderVals() {
    const accent = this.props.accent ?? '#a8352b';
    const motion = this.props.motion ?? true;
    // 挂轴卷起后露出后面的荷花图；点击切换，Tweaks 里可设初始状态
    const rolled = (this.state || {}).rolled ?? this.props.scrollRolled ?? false;
    // 放下挂轴时若有墨虾在外，先让虾游回画里，挂轴稍后再放下
    const wait = !rolled && (this.state || {}).shrimpOut ? 0.9 : 0;
    this.motionOn = motion;
    this.rolledNow = rolled;
    if (!this.hooks) {
      this.hooks = {
        canvas: (el) => { this.canvasEl = el; },
        under: (el) => { this.underEl = el; },
        water: (el) => { this.waterEl = el; },
        lotus: (el) => { this.lotusEl = el; },
        click: (e) => this.startle(e.clientX, e.clientY)
      };
    }
    return {
      accent,
      accentWash: accent + '55',
      play: motion ? 'running' : 'paused',
      canvasRef: this.hooks.canvas,
      underRef: this.hooks.under,
      waterRef: this.hooks.water,
      lotusRef: this.hooks.lotus,
      onPageClick: this.hooks.click,
      paperRows: rolled ? '0fr' : '1fr',
      rollDelay: wait + 's',
      rodH: rolled ? '30px' : '18px',
      // 卷动时地杆上方的纸面明暗，模拟纸弯进卷筒；首次点击前不播放
      curlAnim: !(this.state || {}).toggled ? 'none' : rolled ? 'curlUp' : 'curlDown',
      rolledPressed: rolled ? 'true' : 'false',
      scrollLabel: rolled ? '放下《爱莲说》挂轴' : '卷起《爱莲说》挂轴，看后面的荷花图',
      // 说明文字交叉淡入淡出：旧的随动画开始淡出，新的等卷完再出现
      capOpenOpacity: rolled ? '0' : '1',
      capOpenDelay: rolled ? '0s' : (2.4 + wait) + 's',
      capOpenHidden: rolled ? 'true' : 'false',
      capRolledOpacity: rolled ? '1' : '0',
      capRolledDelay: rolled ? '2.4s' : '0s',
      capRolledHidden: rolled ? 'false' : 'true',
      toggleScroll: () => this.setState({ rolled: !rolled, toggled: true,
        shrimpOut: !!(motion && this.pond && this.pond.shrimp.some((s) => s.mode !== 'hidden' && s.mode !== 'waiting')) }),
      cats: [
        { name: '唐诗', count: '366' },
        { name: '宋词', count: '282' },
        { name: '诗经楚辞', count: '305' },
        { name: '古文名篇', count: '7' },
        { name: '经文国学', count: '3' }
      ]
    };
  }
}
</script>

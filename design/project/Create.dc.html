<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星树书房 · 生成</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&amp;display=swap">
<style>
body{margin:0;background:#f3eee2}
a{color:#23211d}a:hover{color:#a8352b}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
.sr{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
label:has(.sr:focus-visible){outline:2px solid #23211d;outline-offset:3px}
@keyframes inkBloom{0%{transform:scale(.12);opacity:0}30%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes inkDrift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,-3%) scale(1.07)}100%{transform:translate(-3%,2%) scale(.95)}}
@keyframes inkMorph{0%{border-radius:42% 58% 63% 37%/41% 44% 56% 59%}50%{border-radius:58% 42% 38% 62%/55% 61% 39% 45%}100%{border-radius:47% 53% 55% 45%/62% 38% 62% 38%}}
@keyframes scrollSway{0%{transform:rotate(-.45deg)}100%{transform:rotate(.45deg)}}
@keyframes inkPulse{0%,100%{transform:scale(.7);opacity:.55}50%{transform:scale(1.15);opacity:1}}
@keyframes unroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes inkSettle{0%{opacity:0;filter:blur(8px)}35%{opacity:.35}100%{opacity:1;filter:blur(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>

<div style="position: relative; font-family: 'Noto Serif SC', 'Songti SC', serif; background: #f3eee2; color: #23211d; overflow: hidden; padding: 0 6vw">

  <div aria-hidden="true" style="position: absolute; width: 620px; height: 620px; right: -200px; top: -260px; pointer-events: none">
    <div style="width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(closest-side, rgba(35,33,29,.20), rgba(35,33,29,.07) 55%, rgba(35,33,29,0)); filter: blur(22px); animation: inkMorph 18s ease-in-out infinite alternate, inkDrift 30s ease-in-out infinite alternate; animation-play-state: {{play}}"></div>
  </div>

  <header style="position: relative; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; padding-top: 32px">
    <a href="Main.dc.html" aria-label="星树书房 首页" style="display: flex; text-decoration: none">
      <img src="/_blob/14f06e40b86a1c99409f6ac56f90d60f" alt="" style="width: 56px; height: 56px; display: block">
    </a>
    <nav aria-label="主导航" style="display: flex; gap: 36px; font-size: 15px; letter-spacing: .3em">
      <a href="Poems.dc.html" style="text-decoration: none; padding: 12px 0; color: {{accent}}; border-bottom: 1px solid {{accent}}">诗词</a>
      <a href="Main.dc.html#works" style="text-decoration: none; padding: 12px 0">作品</a>
      <a href="Main.dc.html#about" style="text-decoration: none; padding: 12px 0">关于</a>
    </nav>
  </header>

  <main style="position: relative; max-width: 1180px; margin: 0 auto; padding: 40px 0 112px; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 64px 56px">

    <section aria-label="书写设置" style="flex: 1 1 300px; max-width: 420px; min-width: 0; display: flex; flex-direction: column; gap: 40px">
      <a href="Poems.dc.html" style="align-self: flex-start; text-decoration: none; font-size: 14px; letter-spacing: .2em; color: #625c52; padding: 12px 0">← 换一首诗</a>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <h1 style="margin: 0; font-size: 40px; font-weight: 400; letter-spacing: .3em">爱莲说</h1>
        <p style="margin: 0; font-size: 14px; letter-spacing: .2em; color: #625c52">周敦颐 · 古文名篇 · 94 字</p>
      </div>

      <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 14px">
        <legend style="padding: 0; margin-bottom: 14px; font-size: 14px; letter-spacing: .3em; color: #4f4a43">字体</legend>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <label style="display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; min-height: 44px; border: 1px solid {{tradLine}}; background: {{tradBg}}; cursor: pointer">
            <input class="sr" type="radio" name="edition" value="trad" checked="{{isTrad}}" onChange="{{pickTrad}}">
            <span style="font-size: 20px; letter-spacing: .3em">繁體</span>
            <span style="font-size: 12px; letter-spacing: .15em; color: #625c52">传统字形</span>
          </label>
          <label style="display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; min-height: 44px; border: 1px solid {{simpLine}}; background: {{simpBg}}; cursor: pointer">
            <input class="sr" type="radio" name="edition" value="simp" checked="{{isSimp}}" onChange="{{pickSimp}}">
            <span style="font-size: 20px; letter-spacing: .3em">简体</span>
            <span style="font-size: 12px; letter-spacing: .15em; color: #625c52">通行字形</span>
          </label>
        </div>
      </fieldset>

      <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 14px">
        <legend style="padding: 0; margin-bottom: 14px; font-size: 14px; letter-spacing: .3em; color: #4f4a43">纸样</legend>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <label style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; min-height: 44px; border: 1px solid {{cleanLine}}; background: {{cleanBg}}; cursor: pointer">
            <input class="sr" type="radio" name="style" value="clean" checked="{{isClean}}" onChange="{{pickClean}}">
            <span aria-hidden="true" style="flex: none; width: 36px; height: 46px; background: #f6f1e4; box-shadow: 0 0 0 1px rgba(80,66,48,.25)"></span>
            <span style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 17px; letter-spacing: .25em">素笺</span>
              <span style="font-size: 12px; letter-spacing: .15em; color: #625c52">无格</span>
            </span>
          </label>
          <label style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; min-height: 44px; border: 1px solid {{zhalanLine}}; background: {{zhalanBg}}; cursor: pointer">
            <input class="sr" type="radio" name="style" value="zhalan" checked="{{isZhalan}}" onChange="{{pickZhalan}}">
            <span aria-hidden="true" style="flex: none; width: 36px; height: 46px; background: repeating-linear-gradient(to left, #f6f1e4 0 5px, rgba(60,42,30,.55) 5px 6px), #f6f1e4; box-shadow: 0 0 0 1px rgba(60,42,30,.55)"></span>
            <span style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 17px; letter-spacing: .25em">乌丝栏</span>
              <span style="font-size: 12px; letter-spacing: .15em; color: #625c52">有格</span>
            </span>
          </label>
        </div>
      </fieldset>

      <div style="display: flex; flex-direction: column; gap: 14px">
        <button type="button" onClick="{{generate}}" disabled="{{busy}}" style="min-height: 56px; border: none; background: {{btnBg}}; color: #f3eee2; font-size: 18px; letter-spacing: .8em; padding: 0 0 0 .8em">{{btnLabel}}</button>
        <p aria-live="polite" style="margin: 0; font-size: 13px; letter-spacing: .12em; color: #625c52">{{quotaLabel}}</p>
      </div>
    </section>

    <section aria-label="作品" aria-live="polite" style="flex: 1 1 440px; max-width: 560px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 28px">
      <div style="width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; transform-origin: 50% 0; animation: scrollSway 9s ease-in-out infinite alternate; animation-play-state: {{play}}">
        <svg viewBox="0 0 440 54" style="width: 100%; height: 54px; display: block" aria-hidden="true">
          <path d="M96 54 L220 6 L344 54" fill="none" stroke="#6b5a48" stroke-width="1.2"></path>
          <circle cx="220" cy="6" r="3.5" fill="#3b2e24"></circle>
        </svg>
        <div style="width: 100%; height: 11px; border-radius: 6px; background: linear-gradient(#5f4b3a, #36291f)"></div>
        <div style="width: calc(100% - 28px); box-sizing: border-box; padding: 58px 20px 34px; background: #cbc1aa; box-shadow: 0 26px 50px rgba(35,33,29,.20), 0 3px 8px rgba(35,33,29,.10)">
          <div style="position: relative; padding: 7px; background: #ddd4c0">

            <sc-if value="{{isDone}}" hint-placeholder-val="{{true}}">
              <div style="display: flex; flex-direction: column; animation: {{revealAnim}}">
                <img src="/_blob/89eda01835f13b28f1ed8519c9a3aa2b" alt="生成的小楷作品：周敦颐《爱莲说》" style="width: 100%; aspect-ratio: 1276 / 1600; display: block; box-shadow: 0 0 0 1px rgba(80,66,48,.22)">
                <sc-if value="{{showStrip}}" hint-placeholder-val="{{true}}">
                  <div style="display: flex; align-items: center; justify-content: center; min-height: 44px; background: #efe8d8; border-top: 1px dashed rgba(80,66,48,.4); font-size: 12px; letter-spacing: .15em; color: #625c52; text-align: center; padding: 6px 8px">[作品底部签条 · 待原作者授权后确定]</div>
                </sc-if>
              </div>
            </sc-if>

            <sc-if value="{{notDone}}" hint-placeholder-val="{{false}}">
              <div style="position: relative; width: 100%; aspect-ratio: 1276 / 1600; background: {{paperBg}}; box-shadow: inset 0 0 0 12px #f6f1e4, inset 0 0 0 13px {{paperEdge}}, 0 0 0 1px rgba(80,66,48,.22); display: flex; align-items: center; justify-content: center; overflow: hidden">
                <sc-if value="{{showBlob}}" hint-placeholder-val="{{false}}">
                  <div aria-hidden="true" style="position: absolute; width: 46%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(closest-side, rgba(35,33,29,.38), rgba(35,33,29,.12) 60%, rgba(35,33,29,0)); filter: blur(14px); animation: inkPulse 2.4s ease-in-out infinite, inkMorph 6s ease-in-out infinite alternate"></div>
                </sc-if>
                <p style="position: relative; z-index: 2; margin: 0; padding: 18px 10px; writing-mode: vertical-rl; font-size: 17px; letter-spacing: .5em; color: {{hintColor}}; background: #f6f1e4">{{paperHint}}</p>
              </div>
            </sc-if>

            <canvas ref="{{inkRef}}" aria-hidden="true" style="position: absolute; left: 7px; top: 7px; width: calc(100% - 14px); aspect-ratio: 1276 / 1600; pointer-events: none; z-index: 1"></canvas>
            <canvas ref="{{waterRef}}" aria-hidden="true" style="position: absolute; left: 7px; top: 7px; width: calc(100% - 14px); aspect-ratio: 1276 / 1600; pointer-events: none; z-index: 1"></canvas>
          </div>
        </div>
        <div style="width: calc(100% + 24px); height: 16px; border-radius: 8px; background: linear-gradient(90deg, #241b14 0, #241b14 22px, #4a3a2d 22px, #3a2d22 50%, #4a3a2d calc(100% - 22px), #241b14 calc(100% - 22px))"></div>
      </div>

      <p style="margin: 0; font-size: 14px; letter-spacing: .3em; color: #625c52">周敦颐　爱莲说　{{editionLabel}} · {{styleLabel}}</p>

      <sc-if value="{{isDone}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px 32px">
          <a href="/_blob/89eda01835f13b28f1ed8519c9a3aa2b" download="爱莲说_星树书房.jpg" style="text-decoration: none; font-size: 16px; letter-spacing: .5em; padding: 14px 22px 14px 30px; min-height: 44px; box-sizing: border-box; border-top: 1px solid #23211d; border-bottom: 1px solid #23211d">下载作品</a>
          <a href="Poems.dc.html" style="text-decoration: none; font-size: 15px; letter-spacing: .3em; color: #4f4a43; padding: 12px 0">再写一首</a>
        </div>
      </sc-if>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#a8352b","options":["#a8352b","#8c2f28","#b4552d","#23211d"]},"motion":{"editor":"boolean","default":true},"stage":{"editor":"enum","default":"done","options":["ready","loading","done","limit"]},"brandStrip":{"editor":"enum","default":"placeholder","options":["placeholder","none"]},"$preview":{"width":1440,"height":1090}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.pond = { shrimp: [], src: [], blots: [], drops: [], last: 0, time: 0, phase: 'idle', stage: null, t0: 0, w0: 0, nextDrop: 0,
      ambK: 1, ripK: 1, blank: true, water: null };
    // 常态微波：方向（度）、波长（px）、聚光强度、初相；与首页同一套，聚光强度换算成波高
    this.depth = 90;
    this.amb = [[12, 120, 0.4, 0], [77, 95, 0.4, 1.7], [139, 77, 0.4, 4.1], [203, 58, 0.35, 2.6], [254, 105, 0.4, 5.3], [318, 48, 0.3, 0.9], [35, 66, 0.35, 3.3], [290, 84, 0.35, 2.0]].map(([deg, lam, focus, ph]) => {
      const r = deg * Math.PI / 180, k = 2 * Math.PI / lam;
      return [Math.cos(r), Math.sin(r), k, focus / (this.depth * k * k), 5 * Math.sqrt(k), ph];
    });
    this.loop = (now) => { this.tickPond(now); this.raf = requestAnimationFrame(this.loop); };
    this.raf = requestAnimationFrame(this.loop);
  }
  componentWillUnmount() {
    clearTimeout(this.timer);
    cancelAnimationFrame(this.raf);
  }

  // 书写中：纸面化作一池水，墨滴落下荡开涟漪、墨在水里洇开，墨虾从纸边游过；写完水面平息、墨虾游走，作品显现
  makeShrimp() {
    const near = Math.random(), arch = Math.random();
    return { x: 0, y: 0, vx: 0, vy: 0, ang: 0, prevAng: 0, turnRate: 0, L: 52 + 28 * Math.pow(near, 1.2),
      tone: 0.6 + 0.4 * near, side: Math.random() < 0.5 ? 1 : -1,
      pose: { arch, claw: Math.random() - 0.5, ant: Math.random() },
      jit: Array.from({ length: 256 }, () => Math.random()), spr: null,
      mode: 'hidden', t: 0, clock: 0, alpha: 1, scale: 1, kick: 0, phase: Math.random() * 10,
      habit: 0.17 + 0.23 * arch, bend: 0.17 + 0.23 * arch, bendV: 0,
      padPh: Math.random() * 6, legPh: Math.random() * 6, swimHz: 5, limb: 1, yaw: 0, drift: 0,
      ph1: Math.random() * 6, ph2: Math.random() * 6, rx: 0, ry: 0, hover: 0,
      wanderAng: 0, thrustIn: 0, delay: 0, tx: 0, ty: 0 };
  }

  tickPond(now) {
    const cv = this.inkEl, p = this.pond;
    if (!cv || !p) return;
    const dt = p.last ? Math.min(0.05, (now - p.last) / 1000) : 0;
    p.last = now;
    p.time = now / 1000;
    const t = p.time;
    if (this.stageNow !== p.stage) {
      if (this.stageNow === 'loading') this.startPond(t);
      else if (p.phase === 'write') this.settlePond(t);
      p.stage = this.stageNow;
    }
    const rr = cv.getBoundingClientRect(), W = rr.width, H = rr.height;
    if (!this.liveNow || p.phase === 'idle' || !W || !H) {
      if (!p.blank) { this.fitCanvas(cv, W, H, window.devicePixelRatio || 1); this.clearWater(); p.blank = true; }
      return;
    }
    const ctx = this.fitCanvas(cv, W, H, window.devicePixelRatio || 1);
    p.blank = false;
    // 写完后约 1.6 秒内水波渐小、墨渐淡
    let fade = 1;
    if (p.phase === 'settle') {
      const k = Math.min(1, (t - p.t0) / 1.6);
      fade = 1 - k * k * (3 - 2 * k);
      if (k >= 1) { p.phase = 'idle'; this.clearWater(); p.blank = true; return; }
    }
    // 水面从静到动：第一滴墨落下后，微波慢慢起来
    p.ambK = (0.3 + 0.7 * Math.min(1, (t - p.w0) / 2.5)) * fade;
    p.ripK = fade;
    p.src = p.src.filter((r) => t - r.t0 < 4 * (0.45 + 1.4 * r.k));
    if (p.phase === 'write' && t >= p.nextDrop) {
      this.dropInk(t, W, H);
      p.nextDrop = t + 1.8 + Math.random() * 1.2;
    }
    // 墨滴落到水面：激起涟漪，墨在落点洇开
    for (const d of p.drops) {
      if (t - d.t0 < 0.45) continue;
      d.hit = true;
      this.addRipple(d.x, d.y, d.k);
      this.bloom(t, d.x, d.y, d.k);
    }
    p.drops = p.drops.filter((d) => !d.hit);
    this.renderWater(W, H, t, Math.min(1, (t - p.w0) / 0.4) * fade);
    for (const s of p.shrimp) this.stepShrimp(s, dt, W, H);
    for (const s of p.shrimp) {
      if (s.mode !== 'swim' && s.mode !== 'dart') continue;
      const g = this.waterGrad(s.x, s.y, t);
      s.rx = -g[0] * 18;
      s.ry = -g[1] * 18;
      s.alpha = fade;
      this.drawShrimp(ctx, s, t);
    }
    this.drawInk(ctx, dt, t, fade);
  }

  startPond(t) {
    const p = this.pond;
    p.phase = 'write';
    p.t0 = p.w0 = t;
    p.src = [];
    p.blots = [];
    p.drops = [];
    p.nextDrop = t + 0.1;
    p.first = true;
    if (!p.shrimp.length) p.shrimp = Array.from({ length: 2 }, () => this.makeShrimp());
    p.shrimp.forEach((s, i) => { s.mode = 'waiting'; s.delay = 0.7 + i * 0.9 + Math.random() * 0.4; });
  }

  // 写完：不再落墨，墨虾伸直身子朝最近的纸边游走
  settlePond(t) {
    const p = this.pond, cv = this.inkEl, W = cv.getBoundingClientRect().width, H = cv.getBoundingClientRect().height;
    p.phase = 'settle';
    p.t0 = t;
    p.drops = [];
    for (const s of p.shrimp) {
      if (s.mode !== 'swim') { s.mode = 'hidden'; continue; }
      s.mode = 'dart';
      const ex = [[-s.L * 2, s.y, s.x], [W + s.L * 2, s.y, W - s.x], [s.x, -s.L * 2, s.y], [s.x, H + s.L * 2, H - s.y]].sort((a, b) => a[2] - b[2])[0];
      s.tx = ex[0];
      s.ty = ex[1];
    }
  }

  // 一滴墨从上方落下；第一滴落在纸面上部、最重，之后随机落在别处、轻一些，避开中间的提示字
  dropInk(t, W, H) {
    const p = this.pond;
    let x = W * 0.5, y = H * 0.27, k = 1;
    if (!p.first) {
      k = 0.45 + 0.2 * Math.random();
      for (let i = 0; i < 12; i++) {
        x = W * (0.18 + 0.64 * Math.random());
        y = H * (0.14 + 0.72 * Math.random());
        if (Math.abs(x - W / 2) > 60 || Math.abs(y - H / 2) > 110) break;
      }
    }
    p.first = false;
    p.drops.push({ x, y, k, t0: t, hit: false });
  }

  // 墨入水：一团浓墨心，四周几缕淡墨被冲开、越洇越大、慢慢变淡
  bloom(t, x, y, k) {
    const p = this.pond, n = Math.round(6 + 8 * k);
    p.blots.push({ x, y, vx: 0, vy: 0, r0: 3 + 3 * k, grow: 12 + 14 * k, a: 0.5, t0: t, tau: 6 });
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (12 + 50 * Math.random()) * (0.5 + k);
      p.blots.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r0: 2 + 4 * Math.random(),
        grow: (10 + 24 * Math.random()) * (0.6 + 0.6 * k), a: 0.14 + 0.16 * Math.random(), t0: t, tau: 4 + 4 * Math.random() });
    }
    if (p.blots.length > 160) p.blots.splice(0, p.blots.length - 160);
  }

  drawInk(ctx, dt, t, fade) {
    const p = this.pond, ink = (a) => 'rgba(28,26,23,' + Math.max(0, Math.min(1, a)).toFixed(3) + ')';
    p.blots = p.blots.filter((b) => t - b.t0 < b.tau * 4);
    for (const b of p.blots) {
      const age = t - b.t0, f = Math.exp(-1.1 * dt);
      b.vx *= f;
      b.vy *= f;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      const r = b.r0 + b.grow * (1 - Math.exp(-age / 1.4)), a = b.a * Math.min(1, age / 0.15) * Math.exp(-age / b.tau) * fade;
      if (a < 0.004) continue;
      const g = this.waterGrad(b.x, b.y, t), x = b.x - g[0] * 18, y = b.y - g[1] * 18;
      const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, ink(a));
      gr.addColorStop(0.55, ink(a * 0.6));
      gr.addColorStop(1, ink(0));
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    // 下落中的墨滴：俯看是一粒越来越大的浓墨，影子从斜下方收拢到落点
    for (const d of p.drops) {
      const k = Math.max(0, (t - d.t0) / 0.45), rd = (2 + 3.5 * k) * (0.7 + 0.3 * d.k), lift = 1 - k;
      ctx.fillStyle = ink(0.12 * k * fade);
      ctx.beginPath();
      ctx.ellipse(d.x + lift * 16, d.y + lift * 8, rd * 1.3, rd, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = ink(Math.min(1, k * 4) * 0.92 * fade);
      ctx.beginPath();
      ctx.ellipse(d.x, d.y - lift * 26, rd, rd * 1.25, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  stepShrimp(s, dt, W, H) {
    const TAU = Math.PI * 2;
    const turnTo = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    s.t += dt;
    s.clock += dt;
    if (s.mode === 'hidden') return;
    if (s.mode === 'waiting') {
      s.delay -= dt;
      if (s.delay > 0) return;
      // 从任意一边纸缘游进来，朝对边某处去
      const side = Math.floor(Math.random() * 4), u = 0.2 + 0.6 * Math.random(), v = 0.2 + 0.6 * Math.random(), m = s.L * 0.3;
      const ends = [[-m, H * u, W + s.L * 2, H * v], [W + m, H * u, -s.L * 2, H * v], [W * u, -m, W * v, H + s.L * 2], [W * u, H + m, W * v, -s.L * 2]][side];
      [s.x, s.y, s.tx, s.ty] = ends;
      s.ang = s.prevAng = s.wanderAng = Math.atan2(s.ty - s.y, s.tx - s.x) + (Math.random() - 0.5) * 0.5;
      s.vx = Math.cos(s.ang) * 130;
      s.vy = Math.sin(s.ang) * 130;
      s.kick = 1;
      s.thrustIn = 0.5;
      s.mode = 'swim';
      s.t = 0;
    }
    let drag = 1.4, bendTo = s.habit, swim = 6;
    if (s.mode === 'swim') {
      // 与首页游荡同一套：一下一下划水，时而悬停、时而轻收尾巴后退，身体不停屈伸，被水带着侧漂；大方向朝对边
      s.wanderAng += (Math.random() - 0.5) * 3 * dt;
      s.wanderAng += turnTo(s.wanderAng, Math.atan2(s.ty - s.y, s.tx - s.x)) * 0.7 * dt;
      s.ang += clamp(turnTo(s.ang, s.wanderAng), -1.6 * dt, 1.6 * dt);
      s.thrustIn -= dt;
      if (s.thrustIn <= 0) {
        const r = Math.random();
        if (r < 0.16) {
          s.hover = 1;
          s.thrustIn = 0.8 + Math.random() * 1.4;
        } else if (r < 0.24) {
          const push = (50 + Math.random() * 30) * s.L / 60;
          s.vx -= Math.cos(s.ang) * push;
          s.vy -= Math.sin(s.ang) * push;
          s.bendV += 9;
          s.hover = 0;
          s.thrustIn = 0.5 + Math.random() * 0.6;
        } else {
          const push = (60 + Math.random() * 60) * s.L / 60;
          s.vx += Math.cos(s.ang) * push;
          s.vy += Math.sin(s.ang) * push;
          s.kick = 1;
          s.hover = 0;
          s.thrustIn = 0.5 + Math.random() * 1.0;
        }
      }
      s.drift += ((Math.random() - 0.5) * 2 - s.drift) * Math.min(1, 1.5 * dt);
      const side = s.drift * 25 * s.L / 90 * dt;
      s.vx -= Math.sin(s.ang) * side;
      s.vy += Math.cos(s.ang) * side;
      bendTo = s.habit + 0.14 * Math.sin(s.clock * 0.9 + s.ph1) + 0.07 * Math.sin(s.clock * 2.3 + s.ph2) - 0.12 * s.kick;
      swim = s.hover ? 3.5 : 5.5 + 3.5 * s.kick;
    } else if (s.mode === 'dart') {
      // 伸直身子，游泳足快划，朝最近的纸边游出去
      const off = turnTo(s.ang, Math.atan2(s.ty - s.y, s.tx - s.x));
      s.ang += clamp(off, -5 * dt, 5 * dt);
      const sp = 340 * s.L / 60 * Math.max(0.2, Math.cos(off));
      s.vx += (Math.cos(s.ang) * sp - s.vx) * Math.min(1, 3 * dt);
      s.vy += (Math.sin(s.ang) * sp - s.vy) * Math.min(1, 3 * dt);
      drag = 0;
      bendTo = 0.02;
      swim = 10;
    }
    const f = Math.exp(-drag * dt);
    s.vx *= f;
    s.vy *= f;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    // 游出纸面就藏起来；还在书写就过一会儿再从别处游进来
    const out = Math.max(-s.x, s.x - W, -s.y, s.y - H);
    if (s.t > 1 && out > s.L * 1.2) {
      s.mode = this.pond.phase === 'write' ? 'waiting' : 'hidden';
      s.delay = 0.8 + Math.random() * 1.2;
      return;
    }
    const K = s.mode === 'dart' ? 60 : 40, D = 1.6 * Math.sqrt(K);
    const n = Math.ceil(dt / 0.01);
    for (let i = 0; i < n; i++) {
      s.bendV += ((bendTo - s.bend) * K - s.bendV * D) * (dt / n);
      s.bend = clamp(s.bend + s.bendV * (dt / n), 0, 1);
    }
    s.swimHz += (swim - s.swimHz) * Math.min(1, 4 * dt);
    s.padPh += TAU * s.swimHz * dt;
    s.legPh += TAU * s.swimHz * 0.6 * dt;
    const yawTo = s.mode === 'swim' ? 0.06 * Math.sin(s.clock * 1.7 + s.ph1) : 0;
    s.yaw += (yawTo - s.yaw) * Math.min(1, 5 * dt);
    s.kick = Math.max(0, s.kick - dt * 2);
    if (dt > 0) s.turnRate += (turnTo(s.prevAng, s.ang) / dt - s.turnRate) * Math.min(1, 8 * dt);
    s.prevAng = s.ang;
  }

  fitCanvas(c, W, H, dpr) {
    if (c.width !== Math.round(W * dpr) || c.height !== Math.round(H * dpr)) {
      c.width = Math.round(W * dpr);
      c.height = Math.round(H * dpr);
    }
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    return ctx;
  }

  // 水面：与首页同一个着色器；另加 uAmb、uRip 控制微波和涟漪的强弱，uFade 控制整体浓淡，水面平息时三者一起减小
  initWater(cv) {
    const gl = cv.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false, depth: false });
    if (!gl) return null;
    const num = (v) => v.toFixed(6);
    const amb = this.amb.map((a, i) => '  wave(vec2(' + num(a[0]) + ', ' + num(a[1]) + '), ' + num(a[2]) + ', ' + num(a[3]) + ' * uAmb, uPh[' + i + '], p, g, H);').join('\n');
    const fs = [
      '#ifdef GL_FRAGMENT_PRECISION_HIGH',
      'precision highp float;',
      '#else',
      'precision mediump float;',
      '#endif',
      'uniform vec2 uRes;',
      'uniform vec2 uScale;',
      'uniform float uPh[' + this.amb.length + '];',
      'uniform vec4 uSrc[32];',
      'uniform float uAmb;',
      'uniform float uRip;',
      'uniform float uFade;',
      'void wave(vec2 dir, float k, float a, float ph, vec2 p, inout vec2 g, inout vec3 H) {',
      '  float s = k * dot(dir, p) + ph;',
      '  g += a * k * cos(s) * dir;',
      '  H -= a * k * k * sin(s) * vec3(dir.x * dir.x, dir.x * dir.y, dir.y * dir.y);',
      '}',
      'void main() {',
      '  vec2 p = vec2(gl_FragCoord.x, uRes.y * uScale.y - gl_FragCoord.y) / uScale;',
      '  vec2 g = vec2(0.0);',
      '  vec3 H = vec3(0.0);',
      amb,
      '  for (int i = 0; i < 32; i++) {',
      '    vec4 s = uSrc[i];',
      '    if (s.w <= 0.0) continue;',
      '    vec2 d = p - s.xy;',
      '    float r = max(length(d), 8.0);',
      '    float u = (r - 150.0 * s.z) / (22.0 + 30.0 * s.z);',
      '    if (abs(u) > 3.0) continue;',
      '    float k = 6.2832 / (24.0 + 22.0 * s.w);',
      '    float a = uRip * 1.6 * s.w * exp(-u * u - s.z / (0.45 + 1.4 * s.w)) / sqrt(1.0 + r / 50.0);',
      '    float ph = k * (r - 100.0 * s.z);',
      '    float f1 = a * k * cos(ph), f2 = -a * k * k * sin(ph), q = f1 / r;',
      '    vec2 n = d / r;',
      '    g += f1 * n;',
      '    H += vec3(f2 * n.x * n.x + q * (1.0 - n.x * n.x), (f2 - q) * n.x * n.y, f2 * n.y * n.y + q * (1.0 - n.y * n.y));',
      '  }',
      '  float D = ' + num(this.depth) + ';',
      '  float det = (1.0 - D * H.x) * (1.0 - D * H.z) - D * D * H.y * H.y;',
      '  float c = 1.0 / max(abs(det), 0.1);',
      '  float lit = clamp((c - 1.4) / 3.5, 0.0, 1.0);',
      '  float dim = clamp(1.0 - c, 0.0, 1.0);',
      '  float wa = 0.6 * lit;',
      '  float ia = 0.035 + 0.05 * dim;',
      '  gl_FragColor = vec4(vec3(1.0, 0.988, 0.95) * wa + vec3(0.11, 0.102, 0.09) * ia * (1.0 - wa), wa + ia * (1.0 - wa)) * uFade;',
      '}'
    ].join('\n');
    const vs = 'attribute vec2 aPos;\nvoid main() { gl_Position = vec4(aPos, 0.0, 1.0); }';
    const shader = (type, src) => {
      const o = gl.createShader(type);
      gl.shaderSource(o, src);
      gl.compileShader(o);
      return o;
    };
    const prog = gl.createProgram();
    gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      // 着色器编译失败时不画水面，墨虾照常；把原因打到控制台
      console.error('water shader:', gl.getProgramInfoLog(prog));
      return null;
    }
    gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const aPos = gl.getAttribLocation(prog, 'aPos');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
    return { cv, gl, prog, cleared: false, src: new Float32Array(128), ph: new Float32Array(this.amb.length),
      uRes: gl.getUniformLocation(prog, 'uRes'), uScale: gl.getUniformLocation(prog, 'uScale'),
      uPh: gl.getUniformLocation(prog, 'uPh'), uSrc: gl.getUniformLocation(prog, 'uSrc'),
      uAmb: gl.getUniformLocation(prog, 'uAmb'), uRip: gl.getUniformLocation(prog, 'uRip'), uFade: gl.getUniformLocation(prog, 'uFade') };
  }


  renderWater(W, H, t, alpha) {
    const p = this.pond, cv = this.waterEl;
    if (!cv) return;
    if (!p.water || p.water.cv !== cv) p.water = this.initWater(cv) || { cv, gl: null };
    const wv = p.water, gl = wv.gl;
    if (!gl) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1), cw = Math.round(W * dpr), ch = Math.round(H * dpr);
    if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
    gl.viewport(0, 0, cw, ch);
    gl.uniform2f(wv.uRes, W, H);
    gl.uniform2f(wv.uScale, cw / W, ch / H);
    gl.uniform1f(wv.uAmb, p.ambK);
    gl.uniform1f(wv.uRip, p.ripK);
    gl.uniform1f(wv.uFade, alpha);
    this.amb.forEach((a, i) => { wv.ph[i] = (a[5] - a[4] * t) % (Math.PI * 2); });
    gl.uniform1fv(wv.uPh, wv.ph);
    wv.src.fill(0);
    p.src.forEach((r, i) => { wv.src.set([r.x, r.y, t - r.t0, r.k], i * 4); });
    gl.uniform4fv(wv.uSrc, wv.src);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    wv.cleared = false;
  }

  // 水面在 (x, y) 处的坡度，公式与着色器一致
  waterGrad(x, y, t) {
    const p = this.pond;
    let gx = 0, gy = 0;
    for (const [ax, ay, k, a, w, ph] of this.amb) {
      const c = p.ambK * a * k * Math.cos(k * (ax * x + ay * y) + ph - w * t);
      gx += c * ax;
      gy += c * ay;
    }
    for (const r of p.src) {
      const age = t - r.t0, dx = x - r.x, dy = y - r.y, d = Math.max(8, Math.hypot(dx, dy));
      const u = (d - 150 * age) / (22 + 30 * age);
      if (Math.abs(u) > 3) continue;
      const k = 2 * Math.PI / (24 + 22 * r.k);
      const a = p.ripK * 1.6 * r.k * Math.exp(-u * u - age / (0.45 + 1.4 * r.k)) / Math.sqrt(1 + d / 50);
      const f1 = a * k * Math.cos(k * (d - 100 * age));
      gx += f1 * dx / d;
      gy += f1 * dy / d;
    }
    return [gx, gy];
  }

  clearWater() {
    const wv = this.pond.water;
    if (!wv || !wv.gl || wv.cleared) return;
    wv.gl.clearColor(0, 0, 0, 0);
    wv.gl.clear(wv.gl.COLOR_BUFFER_BIT);
    wv.cleared = true;
  }


  // 新波源；满 32 个时挤掉此刻最弱的一个
  addRipple(x, y, k) {
    const p = this.pond, t = p.time;
    if (p.src.length >= 32) {
      let wi = 0, wv = Infinity;
      p.src.forEach((r, i) => {
        const v = r.k * Math.exp(-(t - r.t0) / (0.45 + 1.4 * r.k));
        if (v < wv) { wv = v; wi = i; }
      });
      p.src.splice(wi, 1);
    }
    p.src.push({ x, y, t0: t, k });
  }


  // 虾身拆成头胸、5 个腹节、尾扇各一张小图，只画一次；每帧按弯曲度绕关节转动拼起来。
  // 每张图的画法沿用：淡墨打底、背侧压浓墨、节间留白缝、再擦出飞白
  buildSprites(s) {
    const L = s.L, R = 2;
    const ink = (a) => 'rgba(28,26,23,' + Math.min(1, a) + ')';
    let n = 0;
    const jr = () => s.jit[(n++) % s.jit.length];
    const blur = (g, v) => { g.filter = 'blur(' + (L * v).toFixed(2) + 'px)'; };
    // 在局部坐标 [x0,x1]×[y0,y1] 里画一张小图，四周留出模糊的余量
    const sprite = (x0, y0, x1, y1, paint) => {
      const pad = L * 0.04, c = document.createElement('canvas');
      x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
      c.width = Math.ceil((x1 - x0) * R);
      c.height = Math.ceil((y1 - y0) * R);
      const g = c.getContext('2d');
      g.scale(R, R);
      g.translate(-x0, -y0);
      g.lineCap = 'round';
      paint(g);
      return { c, x0, y0, sw: x1 - x0, sh: y1 - y0 };
    };
    // 飞白：在墨上随机擦出细小白丝，数量按面积
    const flyWhite = (g, x0, y0, x1, y1) => {
      g.filter = 'none';
      g.globalCompositeOperation = 'destination-out';
      const count = Math.round(111 * (x1 - x0) * (y1 - y0) / (L * L));
      for (let i = 0; i < count; i++) {
        const x = x0 + (x1 - x0) * jr(), y = y0 + (y1 - y0) * jr(), len = L * (0.01 + 0.03 * jr()), a = jr() * 0.6 - 0.3;
        g.strokeStyle = 'rgba(0,0,0,' + (0.25 + 0.45 * jr()).toFixed(2) + ')';
        g.lineWidth = Math.max(0.5, L * 0.004);
        g.beginPath();
        g.moveTo(x, y);
        g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
        g.stroke();
      }
      g.globalCompositeOperation = 'source-over';
    };
    // 节间白缝：只擦背侧一半，相邻两节在关节处各擦一道
    const seam = (g, x, h) => {
      g.filter = 'none';
      g.globalCompositeOperation = 'destination-out';
      g.strokeStyle = 'rgba(0,0,0,0.8)';
      g.lineWidth = Math.max(1, L * 0.013);
      g.beginPath();
      g.moveTo(x, -h * 1.1);
      g.lineTo(x, -h * 0.1);
      g.stroke();
      g.globalCompositeOperation = 'source-over';
    };
    // 腹节：局部坐标 +x 朝尾，-y 为背侧
    const segShape = (g, l, h, k2) => {
      g.beginPath();
      g.moveTo(-l * 0.05, -h);
      g.quadraticCurveTo(l * 0.5, -h * 1.12, l * 1.05, -h * 0.85);
      g.quadraticCurveTo(l * (1.0 - 0.2 * k2), h * (0.1 - 0.5 * k2), l * (0.72 - 0.1 * k2), h * (0.62 - 0.9 * k2));
      g.quadraticCurveTo(l * 0.3, h * (0.82 - 1.0 * k2), 0, h * (0.78 - 1.0 * k2));
      g.quadraticCurveTo(-l * 0.12, -h * k2 * 0.5, -l * 0.05, -h);
    };
    const segs = [];
    for (let i = 0; i < 5; i++) segs.push({ l: L * 0.12 * (1 - i * 0.07), h: L * 0.14 * (1 - i * 0.13) });
    segs.forEach((sg, i) => {
      const { l, h } = sg;
      sg.img = sprite(-0.5 * l, -1.2 * h, 1.15 * l, 0.95 * h, (g) => {
        const base = ink(0.34 + 0.12 * jr());
        blur(g, 0.007);
        // 前端垫一片淡墨伸进前一节底下：身子弓起时，节与节之间背侧不露缝
        g.fillStyle = base;
        g.beginPath();
        g.moveTo(l * 0.3, -h * 1.02);
        g.quadraticCurveTo(-l * 0.2, -h * 1.08, -l * 0.42, -h * 0.7);
        g.lineTo(-l * 0.3, h * 0.35);
        g.lineTo(l * 0.3, h * 0.5);
        g.closePath();
        g.fill();
        segShape(g, l, h, 0);
        g.fill();
        g.strokeStyle = ink(0.3);
        g.lineWidth = L * 0.01;
        g.stroke();
        blur(g, 0.005);
        segShape(g, l * 0.98, h, 0.55 + 0.15 * jr());
        g.fillStyle = ink(0.62 + 0.25 * jr());
        g.fill();
        if (i > 0) seam(g, 0, h);
        if (i < 4) seam(g, l, segs[i + 1].h);
        flyWhite(g, -0.1 * l, -h, l, 0.6 * h);
      });
    });
    // 尾扇：三瓣，两侧浓、中间淡
    const fan = sprite(-0.03 * L, -0.15 * L, 0.19 * L, 0.15 * L, (g) => {
      blur(g, 0.008);
      for (const [a, len, al] of [[-0.6, 0.15, 0.8], [0.55, 0.14, 0.72], [0, 0.11, 0.5]]) {
        g.save();
        g.rotate(a + (jr() - 0.5) * 0.15);
        g.fillStyle = ink(al);
        g.beginPath();
        g.moveTo(0, 0);
        g.quadraticCurveTo(L * len * 0.5, -L * 0.055, L * len, -L * 0.02);
        g.quadraticCurveTo(L * len * 1.05, L * 0.03, L * len * 0.7, L * 0.04);
        g.quadraticCurveTo(L * len * 0.3, L * 0.03, 0, 0);
        g.fill();
        g.restore();
      }
      flyWhite(g, 0, -0.08 * L, 0.15 * L, 0.08 * L);
    });
    // 头胸：前尖后宽一团淡墨，背后上方压浓墨，中间一道淡痕透出纸色；再加额剑与双眼
    const head = sprite(-0.1 * L, -0.22 * L, 0.62 * L, 0.15 * L, (g) => {
      const headShape = () => {
        g.beginPath();
        g.moveTo(-L * 0.03, -L * 0.135);
        g.bezierCurveTo(L * 0.12, -L * 0.2, L * 0.3, -L * 0.13, L * 0.46, -L * 0.05);
        g.bezierCurveTo(L * 0.33, 0, L * 0.18, L * 0.1, L * 0.01, L * 0.125);
        g.bezierCurveTo(-L * 0.06, L * 0.06, -L * 0.07, -L * 0.07, -L * 0.03, -L * 0.135);
      };
      blur(g, 0.007);
      headShape();
      g.fillStyle = ink(0.42 + 0.1 * jr());
      g.fill();
      g.strokeStyle = ink(0.3);
      g.lineWidth = L * 0.01;
      g.stroke();
      blur(g, 0.006);
      g.fillStyle = ink(0.88);
      g.beginPath();
      g.moveTo(-L * 0.03, -L * 0.13);
      g.bezierCurveTo(L * 0.12, -L * 0.19, L * 0.28, -L * 0.13, L * 0.42, -L * 0.055);
      g.bezierCurveTo(L * 0.3, -L * 0.05, L * 0.15, -L * 0.03, -L * 0.04, L * 0.0);
      g.fill();
      g.fillStyle = ink(0.95);
      g.beginPath();
      g.moveTo(L * 0.03, -L * 0.05);
      g.quadraticCurveTo(L * 0.14, -L * 0.1, L * 0.27, -L * 0.07);
      g.quadraticCurveTo(L * 0.15, -L * 0.04, L * 0.03, -L * 0.05);
      g.fill();
      g.filter = 'none';
      g.globalCompositeOperation = 'destination-out';
      g.strokeStyle = 'rgba(0,0,0,0.5)';
      g.lineWidth = L * 0.02;
      g.beginPath();
      g.moveTo(L * 0.0, L * 0.03);
      g.quadraticCurveTo(L * 0.14, L * 0.02, L * 0.3, -L * 0.02);
      g.stroke();
      g.globalCompositeOperation = 'source-over';
      flyWhite(g, -0.05 * L, -0.18 * L, 0.45 * L, 0.12 * L);
      g.fillStyle = ink(0.9);
      g.beginPath();
      g.moveTo(L * 0.34, -L * 0.085);
      g.lineTo(L * 0.6, -L * 0.15);
      g.lineTo(L * 0.36, -L * 0.055);
      g.fill();
      g.strokeStyle = ink(0.97);
      g.lineWidth = Math.max(2, L * 0.03);
      g.beginPath();
      g.moveTo(L * 0.37, -L * 0.035);
      g.lineTo(L * 0.45, -L * 0.075);
      g.stroke();
      g.lineWidth = Math.max(1.6, L * 0.024);
      g.beginPath();
      g.moveTo(L * 0.38, -L * 0.005);
      g.lineTo(L * 0.46, L * 0.005);
      g.stroke();
    });
    return { segs, fan, head };
  }

  // 每帧画：长须、长钳、步足、游泳足是细线实时画；虾身按弯曲度把分节小图拼起来
  drawShrimp(ctx, s, t) {
    const L = s.L;
    const ink = (a) => 'rgba(28,26,23,' + Math.min(1, a) + ')';
    const polar = (p, a, r) => [p[0] + Math.cos(a) * r, p[1] + Math.sin(a) * r];
    const line = (pts, w, a) => {
      ctx.strokeStyle = ink(a);
      ctx.lineWidth = w;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.stroke();
    };
    if (!s.spr) s.spr = this.buildSprites(s);
    const spr = s.spr, tuck = 1 - s.limb;
    const fwd = s.vx * Math.cos(s.ang) + s.vy * Math.sin(s.ang);
    const stream = Math.max(0, Math.min(1, -fwd / 320));
    ctx.save();
    ctx.translate(s.x + s.rx, s.y + s.ry);
    ctx.rotate(s.ang + s.yaw);
    ctx.scale(s.scale, s.scale * s.side);
    ctx.globalAlpha = s.alpha * s.tone;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const sw = Math.sin(t * 1.2 + s.phase) * 0.08, wob = Math.sin(t * 1.7 + s.phase) * 0.05;
    // 长须：两根拖到身后很远，一根过背、一根过腹；弹逃时被水流甩向前
    for (const k of [-1, 1]) {
      const reach = L * (2.3 + 0.6 * s.pose.ant), back = 1 - 2 * stream;
      const ex = L * 0.45 - back * reach, ey = k * L * (0.3 + 0.3 * s.pose.ant) + k * L * sw;
      ctx.strokeStyle = ink(0.7);
      ctx.lineWidth = Math.max(0.7, L * 0.008);
      ctx.beginPath();
      ctx.moveTo(L * 0.44, -L * 0.04);
      ctx.bezierCurveTo(L * (0.85 - 0.4 * stream), k * L * 0.1 - L * 0.1, L * 0.45 - back * reach * 0.35, k * L * 0.5, ex, ey);
      ctx.stroke();
    }
    // 短须：向前散开几根
    for (let k = 0; k < 4; k++) {
      line([[L * 0.44, -L * 0.03], polar([L * 0.44, -L * 0.03], -0.32 + k * 0.17 + sw * 0.6, L * (0.38 + 0.14 * (k % 2)))], Math.max(0.6, L * 0.006), 0.6);
    }
    // 长钳：三节折线，越往前越粗，末端一段浓墨钳掌加开叉钳指；身子蜷紧时收向胸前
    const claw = (base, a1, a2, a3, open, a, sc) => {
      const e1 = polar(base, a1, L * 0.36 * sc), e2 = polar(e1, a2, L * 0.32 * sc), e3 = polar(e2, a3, L * 0.34 * sc);
      line([base, e1], Math.max(1, L * 0.012), a * 0.85);
      line([e1, e2], Math.max(1.2, L * 0.016), a * 0.9);
      line([e2, e3], Math.max(2.6, L * 0.045), a);
      line([e3, polar(e3, a3 - open, L * 0.17 * sc)], Math.max(1.4, L * 0.02), a);
      line([e3, polar(e3, a3 + open * 0.7, L * 0.14 * sc)], Math.max(1.2, L * 0.017), a);
    };
    const ca = s.pose.claw, cs = Math.max(0, Math.min(1, (s.bend - 0.35) / 0.65));
    claw([L * 0.2, L * 0.06], 1.0 + ca * 0.4 - cs * 0.6, -0.5 + wob, -0.08 + ca * 0.2 - stream * 0.3, 0.35, 0.5, 0.92);
    // 步足：三笔折线，交替轮划；惊逃时收向腹下
    for (let k = 0; k < 3; k++) {
      const ph = s.legPh + k * 1.4;
      const b = [L * (0.06 + k * 0.07), L * 0.08], m = polar(b, 1.3 - k * 0.12 + 0.35 * s.limb * Math.sin(ph) + 0.6 * tuck, L * 0.14);
      line([b, m, polar(m, 2.1 - k * 0.1 + 0.3 * s.limb * Math.sin(ph + 0.9) + 0.5 * tuck, L * 0.1)], Math.max(0.8, L * 0.009), 0.65);
    }
    // 脊线：从头后向尾，弯曲度 bend 连续决定每个关节的转角，蜷紧时各节略微套叠
    const step = 0.02 + 0.6 * s.bend, shrink = 1 - 0.12 * s.bend, joints = [];
    let p = [0, 0], dir = Math.PI + 0.08;
    for (let i = 0; i < 5; i++) {
      dir += step * (0.5 + i * 0.16);
      joints.push([p, dir]);
      p = polar(p, dir, spr.segs[i].l * shrink);
    }
    // 游泳足：每节腹下一对，由尾向头依次划水，远侧一只淡些
    for (let i = 0; i < 5; i++) {
      const [q, d] = joints[i], { l, h } = spr.segs[i];
      ctx.save();
      ctx.translate(q[0], q[1]);
      ctx.rotate(d);
      for (const [off, al, wd] of [[0.6, 0.35, 0.7], [0, 0.75, 1]]) {
        const ph = s.padPh + (4 - i) * 0.9 + off, b = [l * 0.45, h * 0.6], len = h * 0.85;
        const a0 = 1.1 + 0.55 * s.limb * Math.sin(ph) - 0.6 * tuck;
        const mid = polar(b, a0 - 0.35 * s.limb * Math.cos(ph), len * 0.55), tip = polar(b, a0, len);
        ctx.strokeStyle = ink(al);
        ctx.lineWidth = Math.max(1.2, L * 0.017) * wd;
        ctx.beginPath();
        ctx.moveTo(b[0], b[1]);
        ctx.quadraticCurveTo(mid[0], mid[1], tip[0], tip[1]);
        ctx.stroke();
      }
      ctx.restore();
    }
    const put = (im, q, d) => {
      ctx.save();
      ctx.translate(q[0], q[1]);
      ctx.rotate(d);
      ctx.drawImage(im.c, im.x0, im.y0, im.sw, im.sh);
      ctx.restore();
    };
    put(spr.fan, p, dir);
    for (let i = 4; i >= 0; i--) put(spr.segs[i].img, joints[i][0], joints[i][1]);
    put(spr.head, [0, 0], 0);
    claw([L * 0.24, L * 0.08], 0.8 + ca * 0.5 - cs * 0.6, -0.32 - wob, 0.04 + ca * 0.15 - stream * 0.3, 0.4, 0.95, 1);
    ctx.restore();
  }


  renderVals() {
    const accent = this.props.accent ?? '#a8352b';
    const motion = this.props.motion ?? true;
    const s = this.state || {};
    const stage = s.stage ?? this.props.stage ?? 'done';
    const edition = s.edition ?? 'trad';
    const style = s.style ?? 'clean';
    // 改参数后旧作品不再对应，回到待生成
    const pick = (patch) => () => this.setState({ ...patch, stage: stage === 'limit' ? 'limit' : 'ready' });
    const on = (yes) => ({ line: yes ? '#23211d' : 'rgba(35,33,29,.2)', bg: yes ? 'rgba(35,33,29,.05)' : 'transparent' });
    const t = on(edition === 'trad'), sp = on(edition === 'simp'), c = on(style === 'clean'), z = on(style === 'zhalan');
    const zhalan = style === 'zhalan';
    const hints = { ready: '点生成，作品挂在这里', loading: '正在书写', limit: '额度已用完' };
    // 动效关闭或系统要求减少动态时，书写中仍用原来的墨晕呼吸
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.liveNow = motion && !reduce;
    this.stageNow = stage;
    if (!this.hooks) this.hooks = { ink: (el) => { this.inkEl = el; }, water: (el) => { this.waterEl = el; } };
    return {
      accent,
      inkRef: this.hooks.ink,
      waterRef: this.hooks.water,
      showBlob: stage === 'loading' && !this.liveNow,
      revealAnim: this.liveNow ? 'inkSettle 1.8s ease-out both' : 'unroll 1.4s ease-out both',
      play: motion ? 'running' : 'paused',
      isTrad: edition === 'trad', isSimp: edition === 'simp', isClean: !zhalan, isZhalan: zhalan,
      tradLine: t.line, tradBg: t.bg, simpLine: sp.line, simpBg: sp.bg,
      cleanLine: c.line, cleanBg: c.bg, zhalanLine: z.line, zhalanBg: z.bg,
      pickTrad: pick({ edition: 'trad' }), pickSimp: pick({ edition: 'simp' }),
      pickClean: pick({ style: 'clean' }), pickZhalan: pick({ style: 'zhalan' }),
      editionLabel: edition === 'trad' ? '繁体' : '简体',
      styleLabel: zhalan ? '乌丝栏' : '素笺',
      isDone: stage === 'done', notDone: stage !== 'done', isLoading: stage === 'loading',
      showStrip: (this.props.brandStrip ?? 'placeholder') === 'placeholder',
      paperBg: zhalan ? 'repeating-linear-gradient(to left, #f6f1e4 0 calc(10% - 1px), rgba(60,42,30,.45) calc(10% - 1px) 10%), #f6f1e4' : '#f6f1e4',
      paperEdge: zhalan ? 'rgba(60,42,30,.45)' : 'rgba(80,66,48,.18)',
      paperHint: hints[stage] || '',
      hintColor: stage === 'limit' ? accent : '#625c52',
      busy: stage === 'loading' || stage === 'limit',
      btnBg: stage === 'loading' || stage === 'limit' ? '#8a8379' : '#23211d',
      btnLabel: stage === 'loading' ? '书写中' : stage === 'done' ? '重写' : '生成',
      quotaLabel: stage === 'limit' ? '[本小时 / 今日] 额度已用完，[整点后] 再来' : '[本小时 / 今日] 还可生成 [8] 幅',
      generate: () => {
        this.setState({ stage: 'loading' });
        clearTimeout(this.timer);
        this.timer = setTimeout(() => this.setState({ stage: 'done' }), 4200);
      }
    };
  }
}
</script>

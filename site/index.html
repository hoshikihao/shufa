<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星树书房</title>
<meta name="description" content="择一首诗，写成一幅小楷。">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/fonts.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/base.css">
<style>
@keyframes mountainPan { from { transform: translateX(0) } to { transform: translateX(-50%) } }
@keyframes mistBreath { 0%, 100% { opacity: .55 } 50% { opacity: .9 } }
@keyframes riseIn { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
@keyframes fallIn { from { opacity: 0; transform: translateY(-18px) } to { opacity: 1; transform: translateY(0) } }
@keyframes curlUp { 0% { opacity: 0 } 8% { opacity: 1 } 90% { opacity: 1 } 100% { opacity: 0 } }
@keyframes curlDown { 0% { opacity: 0 } 8% { opacity: 1 } 90% { opacity: 1 } 100% { opacity: 0 } }

.pond { position: relative; isolation: isolate; overflow: hidden; }
.pond-layer { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
.pond-layer.top { z-index: 4; }

.hero { position: relative; min-height: 860px; box-sizing: border-box; padding: 0 6vw; }
.backdrop { position: absolute; inset: 0; pointer-events: none; z-index: -2; }
.bloom { position: absolute; }
.bloom .ink-blob { animation: inkMorph 18s ease-in-out infinite alternate, inkDrift 28s ease-in-out infinite alternate; }
.bloom.b1 { width: 760px; height: 760px; right: -120px; top: -180px; animation: inkBloom 4.5s cubic-bezier(.2,.7,.2,1) both; }
.bloom.b1 .ink-blob { background: radial-gradient(closest-side, rgba(35,33,29,.30), rgba(35,33,29,.12) 55%, rgba(35,33,29,0)); }
.bloom.b2 { width: 520px; height: 520px; left: -160px; top: 300px; animation: inkBloom 5.5s cubic-bezier(.2,.7,.2,1) .8s both; }
.bloom.b2 .ink-blob { background: radial-gradient(closest-side, rgba(35,33,29,.20), rgba(35,33,29,.07) 60%, rgba(35,33,29,0)); animation-duration: 18s, 34s; animation-direction: alternate, alternate-reverse; }
.bloom.b3 { width: 180px; height: 180px; left: 46%; top: 120px; animation: inkBloom 3.2s cubic-bezier(.2,.7,.2,1) 1.6s both; }
.bloom.b3 .ink-blob { background: radial-gradient(closest-side, rgba(168,53,43,.33), rgba(168,53,43,0)); animation-duration: 18s, 22s; }
/* 窄屏上墨晕按比例缩小，免得整屏发灰 */
@media (max-width: 600px) {
  .bloom.b1 { width: 420px; height: 420px; right: -160px; top: -140px; }
  .bloom.b2 { width: 300px; height: 300px; left: -140px; top: 420px; }
  .bloom.b3 { width: 120px; height: 120px; left: 40%; top: 160px; }
}
.hills { position: absolute; left: 0; right: 0; bottom: 0; height: 300px; overflow: hidden; }
.hills .far { position: absolute; left: 0; bottom: 40px; width: 200%; height: 240px; animation: mountainPan 160s linear infinite; }
.hills .near { position: absolute; left: 0; bottom: 0; width: 200%; height: 190px; animation: mountainPan 90s linear infinite; }
.hills svg { width: 100%; height: 100%; display: block; }
.hills .mist { position: absolute; left: 0; right: 0; bottom: 70px; height: 90px; background: linear-gradient(rgba(243,238,226,0), rgba(243,238,226,.8) 50%, rgba(243,238,226,0)); animation: mistBreath 12s ease-in-out infinite; }
.hills .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 110px; background: linear-gradient(rgba(243,238,226,0), var(--paper) 70%); }

.stage { position: relative; max-width: 1180px; margin: 0 auto; min-height: 780px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 56px 72px; padding: 24px 0 170px; }
.intro { flex: 0 1 240px; display: flex; flex-direction: column; align-items: flex-end; gap: 48px; animation: riseIn 1.6s ease-out 1.2s both; }
.intro .titles { display: flex; flex-direction: row-reverse; gap: 30px; align-items: flex-start; }
.intro h1 { margin: 0; writing-mode: vertical-rl; font-size: 60px; font-weight: 300; letter-spacing: .45em; line-height: 1; }
.intro .tagline { margin: 0; writing-mode: vertical-rl; padding-top: 3.4em; font-size: 18px; letter-spacing: .42em; line-height: 2.1; color: var(--ink-soft); }
.intro .cta { display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
.intro .cta p { margin: 0; font-size: 13px; letter-spacing: .15em; color: var(--muted); white-space: nowrap; }

/* 挂轴与后面的荷花图 */
.works { margin: 0; flex: 0 1 420px; min-width: 300px; display: flex; flex-direction: column; align-items: center; gap: 22px; animation: fallIn 2s ease-out .4s both; }
.works .slot { width: 100%; display: grid; }
.works .spacer { grid-area: 1 / 1; display: block; height: 86px; padding-bottom: 125.39%; visibility: hidden; }
.works .frame { grid-area: 1 / 1; align-self: stretch; margin: 95px 20px 10px; box-sizing: border-box; padding: 22px; display: flex; flex-direction: column; justify-content: center; background: #e4dccb; border: 3px solid #3b2e24; box-shadow: 0 6px 14px rgba(35,33,29,.14), inset 0 0 0 1px rgba(80,66,48,.18); }
.works .frame img { width: 100%; aspect-ratio: 1002 / 1024; display: block; box-shadow: 0 0 0 1px rgba(80,66,48,.25); }
.scroll-btn { grid-area: 1 / 1; align-self: start; position: relative; width: 100%; margin: 0; padding: 0; border: none; background: none; cursor: pointer; display: block; transform-origin: 50% 0; animation: scrollSway 9s ease-in-out infinite alternate; }
.scroll-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
/* 纸面用 grid 行 1fr↔0fr 过渡；按钮必须是 block，不能是 flex，否则纸面和地杆缩放不同步 */
.scroll-paper { display: grid; width: calc(100% - 28px); margin: 0 auto; overflow: hidden; grid-template-rows: 1fr; transition: grid-template-rows 2.8s cubic-bezier(.4,.1,.6,.9); transition-delay: var(--roll-delay, 0s); }
.scroll-paper > span { display: block; min-height: 0; }
.scroll-paper img { aspect-ratio: 1276 / 1600; }
.rod-bottom { position: relative; display: block; width: calc(100% + 24px); margin-left: -12px; height: 18px; transition: height 2.8s cubic-bezier(.4,.1,.6,.9); transition-delay: var(--roll-delay, 0s); border-radius: 8px; background: linear-gradient(90deg, #241b14 0, #3a2d22 22px, rgba(0,0,0,0) 22px, rgba(0,0,0,0) calc(100% - 22px), #3a2d22 calc(100% - 22px), #241b14 100%), linear-gradient(#e6dcc6, #cbc1aa 38%, #a59a82 78%, #8a7f6a); box-shadow: 0 6px 12px rgba(35,33,29,.18); }
/* 卷动时地杆上方的纸面明暗，模拟纸弯进卷筒；首次点击前不播放 */
.rod-bottom .curl { position: absolute; left: 26px; right: 26px; bottom: 100%; height: 44px; background: linear-gradient(rgba(35,33,29,0), rgba(35,33,29,.08) 45%, rgba(35,33,29,.30) 88%, rgba(250,244,230,.45)); opacity: 0; animation: var(--curl, none) 2.8s cubic-bezier(.4,.1,.6,.9) both; animation-delay: var(--roll-delay, 0s); }
.works.rolled .scroll-paper { grid-template-rows: 0fr; }
.works.rolled .rod-bottom { height: 30px; }
.works figcaption { display: grid; text-align: center; }
.works figcaption > span { grid-area: 1 / 1; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: opacity .5s ease; }
.works figcaption .name { font-size: 14px; letter-spacing: .3em; color: var(--muted); }
.works figcaption .hint { font-size: 12px; letter-spacing: .25em; color: var(--muted); }

.shelf { position: relative; max-width: 960px; margin: 0 auto; padding: 24px 6vw 96px; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px; }
.shelf h2 { margin: 0; font-size: 30px; font-weight: 400; letter-spacing: .3em; }
.shelf .lead { margin: 0; font-size: 15px; letter-spacing: .12em; color: var(--muted); }
.shelf .heading, .shelf form { display: flex; flex-direction: column; gap: 12px; }
.shelf form { gap: 10px; }
.shelf label { font-size: 14px; letter-spacing: .2em; color: var(--ink-soft); }
.shelf input { font-family: inherit; font-size: 18px; letter-spacing: .1em; padding: 14px 4px; border: none; border-bottom: 1px solid var(--ink); border-radius: 0; background: transparent; color: var(--ink); outline-offset: 4px; -webkit-appearance: none; appearance: none; }
.shelf .cats { display: flex; flex-wrap: wrap; gap: 12px 28px; }
.shelf .cats a { text-decoration: none; font-size: 16px; letter-spacing: .2em; padding: 10px 0; min-height: 44px; box-sizing: border-box; }
.shelf .cats small { font-size: 13px; color: var(--muted); letter-spacing: .05em; margin-left: 8px; }
</style>
</head>
<body>
<div class="pond" id="pond">

  <section class="hero">
    <div class="backdrop" aria-hidden="true">
      <div class="bloom b1"><div class="ink-blob"></div></div>
      <div class="bloom b2"><div class="ink-blob"></div></div>
      <div class="bloom b3"><div class="ink-blob"></div></div>
      <div class="hills">
        <div class="far">
          <svg viewBox="0 0 2880 240" preserveAspectRatio="none">
            <path d="M0 170 C140 120 220 60 340 90 C430 112 480 40 600 34 C720 28 780 120 880 128 C980 136 1040 70 1150 62 C1260 54 1330 140 1400 162 L1440 170 L1440 240 L0 240 Z" fill="#23211d" opacity=".06"></path>
            <path transform="translate(1440 0)" d="M0 170 C140 120 220 60 340 90 C430 112 480 40 600 34 C720 28 780 120 880 128 C980 136 1040 70 1150 62 C1260 54 1330 140 1400 162 L1440 170 L1440 240 L0 240 Z" fill="#23211d" opacity=".06"></path>
          </svg>
        </div>
        <div class="near">
          <svg viewBox="0 0 2880 190" preserveAspectRatio="none">
            <path d="M0 150 C100 128 180 80 280 96 C380 112 420 150 520 140 C640 128 700 70 820 78 C940 86 990 146 1100 150 C1210 154 1290 112 1380 132 L1440 150 L1440 190 L0 190 Z" fill="#23211d" opacity=".11"></path>
            <path transform="translate(1440 0)" d="M0 150 C100 128 180 80 280 96 C380 112 420 150 520 140 C640 128 700 70 820 78 C940 86 990 146 1100 150 C1210 154 1290 112 1380 132 L1440 150 L1440 190 L0 190 Z" fill="#23211d" opacity=".11"></path>
          </svg>
        </div>
        <div class="mist"></div>
        <div class="fade"></div>
      </div>
    </div>

    <header class="site-header">
      <a class="logo" href="#top" aria-label="星树书房 首页"><img src="assets/logo.png" alt=""></a>
      <nav class="site-nav" aria-label="主导航">
        <a href="poems.html">诗词</a>
        <a href="#works">作品</a>
        <a href="#about">关于</a>
      </nav>
    </header>

    <div class="stage">
      <div class="intro">
        <div class="titles">
          <h1>星树书房</h1>
          <p class="tagline">择一首诗<br>写成一幅小楷</p>
        </div>
        <div class="cta">
          <a class="btn-line" href="poems.html">择一首诗</a>
          <p>唐诗 · 宋词 · 诗经楚辞 · 古文，963 首</p>
        </div>
      </div>

      <figure class="works" id="works">
        <div class="slot">
          <span class="spacer" aria-hidden="true"></span>
          <div class="frame">
            <img id="lotus" src="assets/lotus-wuguanzhong.jpg" alt="吴冠中 1990 年所作荷花图">
          </div>
          <button type="button" class="scroll-btn" id="scrollBtn" aria-pressed="false" aria-label="卷起《爱莲说》挂轴，看后面的荷花图">
            <svg class="scroll-hanger" viewBox="0 0 440 54" aria-hidden="true">
              <path d="M96 54 L220 6 L344 54" fill="none" stroke="#6b5a48" stroke-width="1.2"></path>
              <circle cx="220" cy="6" r="3.5" fill="#3b2e24"></circle>
            </svg>
            <span class="scroll-rod-top"></span>
            <span class="scroll-paper scroll-shadow">
              <span>
                <span class="scroll-mount">
                  <span class="scroll-core">
                    <img src="assets/ailianshuo-sample.jpg" alt="小楷作品样张：周敦颐《爱莲说》，繁体，无格素笺">
                  </span>
                </span>
              </span>
            </span>
            <span class="rod-bottom"><span class="curl"></span></span>
          </button>
        </div>
        <figcaption>
          <span id="capOpen" aria-hidden="false">
            <span class="name">周敦颐　爱莲说　繁体 · 素笺</span>
            <span class="hint">轻点挂轴，卷起看画</span>
          </span>
          <span id="capRolled" aria-hidden="true" style="opacity: 0">
            <span class="name">吴冠中　荷花　1990</span>
            <span class="hint">再点一下，放下挂轴</span>
          </span>
        </figcaption>
      </figure>
    </div>
  </section>

  <section class="shelf" id="shelf">
    <div class="heading">
      <h2>从一首诗开始</h2>
      <p class="lead">选好诗，选繁体或简体、有格或无格，即可生成小楷作品。</p>
    </div>

    <form action="poems.html" method="get" role="search">
      <label for="poemSearch">搜索</label>
      <input id="poemSearch" name="q" type="search" placeholder="诗题、作者或名句" enterkeyhint="search">
    </form>

    <div class="cats" role="list" aria-label="诗词分类">
      <a role="listitem" href="poems.html?cat=唐诗">唐诗<small>366</small></a>
      <a role="listitem" href="poems.html?cat=宋词">宋词<small>282</small></a>
      <a role="listitem" href="poems.html?cat=诗经楚辞">诗经楚辞<small>305</small></a>
      <a role="listitem" href="poems.html?cat=古文名篇">古文名篇<small>7</small></a>
      <a role="listitem" href="poems.html?cat=经文国学">经文国学<small>3</small></a>
    </div>
  </section>

  <footer class="site-footer" id="about">
    <span>星树书房 · 个人非商业项目</span>
    <span>书法渲染：[待原作者授权后确认署名]</span>
  </footer>

  <canvas class="pond-layer" id="pondUnder" aria-hidden="true"></canvas>
  <canvas class="pond-layer" id="pondWater" aria-hidden="true"></canvas>
  <canvas class="pond-layer top" id="pondTop" aria-hidden="true"></canvas>
</div>
<script type="module" src="js/page-home.js"></script>
</body>
</html>
